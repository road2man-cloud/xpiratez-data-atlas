<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Piratez 2.1 병종 DB</title>
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0;url=./modern/">
<script>
(() => {
  // Preserve supported 2.1 links without reopening the retired 1.1.1 catalog.
  const target = new URL("./modern/", location.href);
  const from = new URLSearchParams(location.search);
  for (const key of ["family","q","profile"]) {
    if (from.has(key)) target.searchParams.set(key,from.get(key));
  }
  if (["profiles","soldiers","transformations"].includes(from.get("dataset")))
    target.searchParams.set("dataset",from.get("dataset"));
  target.hash = ["#researchMaxima","#legacyMaximaArchive"].includes(location.hash)
    ? "#originMaxima" : location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<main>
  <p>X-Piratez 2.1 병종 DB로 이동합니다.</p>
  <p><a href="./modern/">병종 DB 열기</a></p>
</main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPiratez 탈것·기체 DB</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <a class="back" href="../">← Data Atlas</a>
  <p class="eyebrow">XPiratez v.o1.1.1 · OXCE 8.6</p>
  <h1>탈것 · 기체 DB</h1>
  <p class="lede">탑승인원·속도·연료·내구·무장·레이더와 함께 실제 구매/제조 방법, 필요한 이벤트 재료, 해금 연구트리, 명목 누적 연구량, 분기 전용 조건까지 비교합니다.</p>
</div></header>
<main class="wrap">
  <section id="summary" class="summary"></section>
  <section class="toolbar card">
    <div class="field grow"><label for="search">검색</label><input id="search" type="search" placeholder="스쿨버스, 에어트럭, 연구명, 분기…"></div>
    <div class="field"><label for="route">루트</label><select id="route"><option value="">전체</option><option value="exclusive">분기 전용</option><option value="open">공통/복수 경로</option></select></div>
    <div class="field"><label for="capacity">수송</label><select id="capacity"><option value="">전체</option><option value="troop">병력 탑승 가능</option><option value="large">10명 이상</option></select></div>
  </section>
  <section class="explain card"><strong>연구량 계산</strong><span>dependencies + requires를 중복 제거한 명목 합계입니다. unlocks/getOneFree/이벤트 직접 지급은 우회가 가능하므로 상세창에서 분기·표본·이벤트 조건을 함께 확인하세요.</span></section>
  <section class="table-card card">
    <div class="table-head"><div><p class="eyebrow">정렬 가능</p><h2>탈것·기체 96종</h2></div><p id="rowCount" class="muted"></p></div>
    <div class="table-shell"><table id="craftTable"><thead></thead><tbody></tbody></table></div>
  </section>
</main>
<dialog id="detailDialog"><button id="closeDialog" class="close">×</button><div id="detailBody"></div></dialog>
<script src="app.js"></script>
</body></html>

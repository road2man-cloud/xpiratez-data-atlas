name: XPZ3D R36MA UV seam color normal rebake
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36ma-seam-rebake-20261128/source/**'
      - '.github/workflows/xpz3d-r36ma-seam-rebake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36ma-seam-rebake
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
            experimental/xpz3d/f11/r36lz-cage-roundtrip-20261128
            experimental/xpz3d/f11/r36ma-seam-rebake-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce four sculpt-aware seam-rebaked GLBs and 2048 textures
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36ma-seam-rebake-20261128
          SCRIPT=$ROOT/source/build_r36ma.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SCRIPT"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            for S in FLOW GUARDED; do
              NAME="${V}_${S}"
              SOURCE="$BASE/r36lz-cage-roundtrip-20261128/output/compact/R36LZ_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              node --max-old-space-size=4096 "$SCRIPT" "$SOURCE" "$OUT" 6
              node --max-old-space-size=4096 "$COMPACT" "$OUT/R36MA_SEAM_REBAKED_2100_FULL.glb" "$ROOT/output/compact/R36MA_${NAME}_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['FLOW','GUARDED']){
            const name=v+'_'+s,rep=JSON.parse(fs.readFileSync(path.join(root,name,'R36MA_SEAM_REBAKE.report.json')));
            const file=path.join(root,'compact','R36MA_'+name+'_2100_COMPACT_FULL.glb'),b=fs.readFileSync(file);
            if(rep.triangles!==2100||rep.joints!==63||rep.metrics.edgesRebaked<4||
              !rep.metrics.changedAlbedoPixels&&!rep.metrics.changedNormalPixels||
              b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('R36MA incomplete '+name);
            console.log(name,rep.metrics.edgesRebaked,rep.metrics.changedAlbedoPixels,rep.metrics.changedNormalPixels,b.length);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MA-sculpt-aware-UV-seam-rebakes
          path: experimental/xpz3d/f11/r36ma-seam-rebake-20261128/output/
          retention-days: 90
      - name: Publish compact GLBs, texture PNG and reports
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36ma-seam-rebake-20261128/output
          rm -f "$ROOT"/ART_FLOW/*.glb "$ROOT"/ART_GUARDED/*.glb
          rm -f "$ROOT"/SUBTLE_FLOW/*.glb "$ROOT"/SUBTLE_GUARDED/*.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36MA geometry seam image rebake"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

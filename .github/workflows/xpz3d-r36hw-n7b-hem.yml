name: XPZ3D R36HW N7B hem-to-leg geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n7b-hem.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n6-surface-rebase-20261128/output/R36HW_N6_REBASED_SURFACE.glb
            experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/
            .github/workflows/xpz3d-r36hw-n7b-hem.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/source/build_r36hw_n7.cjs
          node experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/source/build_r36hw_n7.cjs
      - name: Check built GLB and source rig
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/reports/R36HW_N7_HEM_CONTINUITY.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.trianglesBefore!==2080||r.trianglesAfter>2100||r.trianglesAfter<2080||r.skinJoints!==63||r.faceTrianglesUnchanged!==644||r.hairTrianglesUnchanged!==294||r.extraTriangles!==18||r.hemVerticesModified<8)throw Error(JSON.stringify(r));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/output/R36HW_N7_HEM_CONTINUITY.glb');
          if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('Malformed N7 GLB');
          console.log(JSON.stringify({triangles:r.trianglesAfter,hemVertices:r.hemVerticesModified,sha256:r.outputSha256}));
          NODE
      - name: Publish actual GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/output/R36HW_N7_HEM_CONTINUITY.glb experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/reports/R36HW_N7_HEM_CONTINUITY.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): N7B hem to source leg geometry"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N7B-actual-geometry
          path: |
            experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/output/R36HW_N7_HEM_CONTINUITY.glb
            experimental/xpz3d/f11/r36hw-n7-hem-continuity-20261129/reports/R36HW_N7_HEM_CONTINUITY.json

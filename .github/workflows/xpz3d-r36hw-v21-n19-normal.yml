name: XPZ3D V21 N19 textile normal atlas
on:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-v21-n19-normal.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-v21-n19-textile-normal
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require V20 and N20 GLBs
        run: |
          test -s experimental/xpz3d/f11/r36hw-athletic-v20-welded-n19-20261129/output/R36HW_F11_ATHLETIC_SUIT_V20_N19_WELDED.glb
          test -s experimental/xpz3d/f11/r36hw-n20-v10-nude-profile-20261129/output/R36HW_N20_V10_BODY_N19_CENTER.glb
      - name: Build V21 GLB and micro-normal atlas with Node.js
        run: |
          node experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/source/build.cjs \
            experimental/xpz3d/f11/r36hw-athletic-v20-welded-n19-20261129/output/R36HW_F11_ATHLETIC_SUIT_V20_N19_WELDED.glb \
            experimental/xpz3d/f11/r36hw-n20-v10-nude-profile-20261129/output/R36HW_N20_V10_BODY_N19_CENTER.glb \
            experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/output/R36HW_F11_ATHLETIC_SUIT_V21_N19_NORMAL_DETAIL.glb
      - uses: actions/upload-artifact@v4
        with:
          name: r36hw-v21-n19-normal-detail
          path: |
            experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/output/*
            experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/reports/*
      - name: Publish GLB PNG and report
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/output experimental/xpz3d/f11/r36hw-athletic-v21-n19-normal-bake-20261129/reports
          if ! git diff --cached --quiet; then
            git commit -m "build(xpz3d): publish V21 N19 micro normal atlas and GLB"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

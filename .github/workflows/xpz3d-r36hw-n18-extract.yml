name: XPZ3D R36HW N18 local-only editing GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/extract_center_n18.cjs'
      - '.github/workflows/xpz3d-r36hw-n18-extract.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/output/R36HW_N18_FRONT_SKIN_RESTORED.glb
            experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/
            .github/workflows/xpz3d-r36hw-n18-extract.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/extract_center_n18.cjs
          node experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/extract_center_n18.cjs
      - name: Check center-only actual GLB patch
        run: |
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/reports/R36HW_N18_CENTER_EDITING_SUBMESH.json','utf8'));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/output/R36HW_N18_CENTER_EDITING_SUBMESH.glb');
          if(r.triangles<35||r.triangles>266||r.skinJoints!==63||!r.sourceUVPreserved||b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({localTriangles:r.triangles,sha:r.outputSHA256}));
          NODE
      - name: Publish N18 center editing mesh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/output/R36HW_N18_CENTER_EDITING_SUBMESH.glb experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/reports/R36HW_N18_CENTER_EDITING_SUBMESH.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish N18 local pelvis editing-only GLB"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

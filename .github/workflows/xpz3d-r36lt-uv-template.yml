name: XPZ3D R36LT export body UV detail paint templates
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36lt-texture-projection-20261128/source/export_uv_template.cjs'
      - 'experimental/xpz3d/f11/r36lt-texture-projection-20261128/config.example.json'
      - '.github/workflows/xpz3d-r36lt-uv-template.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36lt-uv-template
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export actual mesh-UV masks, paint crop and wire guide
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36lt-texture-projection-20261128
          MODEL=$BASE/r36ls-illustrated-skin-20261128/output/compact/R36LS_ART_2100_COMPACT_FULL.glb
          node --check "$ROOT/source/export_uv_template.cjs"
          rm -rf "$ROOT/output/uv-template"
          node --max-old-space-size=4096 "$ROOT/source/export_uv_template.cjs" "$MODEL" "$ROOT/config.example.json" "$ROOT/output/uv-template"
          node - "$ROOT/output/uv-template/R36LT_UV_TEMPLATE.report.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.totalTriangles!==2100||r.skinJoints!==63||!r.regions.some(x=>x.selectedPixels>0))throw Error('UV output mismatch');
          console.log(JSON.stringify(r.regions));
          NODE
      - name: Archive drawable UV templates
        uses: actions/upload-artifact@v4
        with:
          name: R36LT-real-mesh-UV-templates
          path: experimental/xpz3d/f11/r36lt-texture-projection-20261128/output/uv-template/
          retention-days: 90
      - name: Publish UV template assets to main without forced push
        shell: bash
        run: |
          set -euo pipefail
          DIR=experimental/xpz3d/f11/r36lt-texture-projection-20261128/output/uv-template
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36LT measured UV painting templates"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

name: Verify item and research data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-item-research.yml"
      - "tools/build-item-research-data.mjs"
      - "tools/data-normalize.mjs"
      - "tools/check-item-research-data.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install generator dependencies
        run: npm install

      - name: Download official X-Piratez v.o1.1.1
        run: |
          mkdir -p .cache/xpz
          curl -fL --retry 4 --connect-timeout 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36" \
            -e "https://www.moddb.com/mods/x-piratez/downloads/xpz-o1-19-jun-2026-reincarnated-in-another-world-but-everything-here-is-ai-slop" \
            "https://www.moddb.com/downloads/mirror/311212/129/e401cf49784caffcd0ce43a27a30929a/?referer=https://www.moddb.com/mods/x-piratez/downloads/xpz-o1-19-jun-2026-reincarnated-in-another-world-but-everything-here-is-ai-slop" \
            -o .cache/xpz/Dioxine_XPiratez_o1.1.1.rar

      - name: Verify official archive
        run: echo "79c89ba604606b86614dcfeb0f376061  .cache/xpz/Dioxine_XPiratez_o1.1.1.rar" | md5sum -c -

      - name: Extract X-Piratez ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p .cache/unpacked
          unar -q -o .cache/unpacked .cache/xpz/Dioxine_XPiratez_o1.1.1.rar
          META=$(find .cache/unpacked -type f -path "*/user/mods/Piratez/metadata.yml" -print -quit)
          test -n "$META"
          MOD_PATH=${META%/metadata.yml}
          echo "XPIRATEZ_MOD_PATH=$MOD_PATH" >> "$GITHUB_ENV"

      - name: Generate normalized item and research DB
        run: |
          rm -rf .cache/item-research-data
          node tools/build-item-research-data.mjs \
            --source "$XPIRATEZ_MOD_PATH" \
            --out .cache/item-research-data

      - name: Verify generated DB
        run: node tools/check-item-research-data.mjs --data .cache/item-research-data

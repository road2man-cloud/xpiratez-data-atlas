name: Verify item and research data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-item-research.yml"
      - "tools/build-item-research-data.mjs"
      - "tools/data-normalize.mjs"
      - "tools/check-item-research-data.mjs"
      - "tools/migrate-research-insight-sidecars.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Migrate embedded research insights to sidecars
        run: node tools/migrate-research-insight-sidecars.mjs --data public/items/data

      - name: Verify migrated research DB
        run: node tools/check-item-research-data.mjs --data public/items/data

      - name: Publish migrated research data
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node tools/migrate-research-insight-sidecars.mjs --data public/items/data
          node tools/check-item-research-data.mjs --data public/items/data
          if git diff --quiet -- public/items/data/research-index.json public/items/data/research-chunks public/items/data/research-insight-index.json public/items/data/research-insight-chunks; then
            echo "Research data and insight sidecars already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/items/data/research-index.json public/items/data/research-chunks public/items/data/research-insight-index.json public/items/data/research-insight-chunks
          git commit -m "Migrate research insight sidecars"
          git push origin HEAD:main

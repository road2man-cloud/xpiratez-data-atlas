name: Build item and research data

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Direct URL to Dioxine_XPiratez_o1.1.1.rar
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Download XPZ archive
        uses: suisei-cn/actions-download-file@9f75b8c2dad5ccced7509c44a3b881c5613abde2
        with:
          url: ${{ inputs.archive_url }}
          target: ".cache/xpz"
          filename: "xpiratez.rar"
          retry-times: 4
      - name: Verify official o1.1.1 archive
        run: echo "79c89ba604606b86614dcfeb0f376061  .cache/xpz/xpiratez.rar" | md5sum -c -
      - name: Extract ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p .cache/unpacked
          unar -q -o .cache/unpacked .cache/xpz/xpiratez.rar
          META=$(find .cache/unpacked -type f -path "*/user/mods/Piratez/metadata.yml" -print -quit)
          test -n "$META"
          MOD_PATH=${META%/metadata.yml}
          echo "XPIRATEZ_MOD_PATH=$MOD_PATH" >> "$GITHUB_ENV"
      - name: Generate item and research data
        run: |
          node tools/build-item-research-data.mjs --source "$XPIRATEZ_MOD_PATH" --out public/items/data
          node -e 'const i=require("./public/items/data/items-index.json"),r=require("./public/items/data/research-index.json"); if(i.index.length!==4007||r.index.length!==4612) throw new Error("Unexpected XPZ dataset counts"); console.log("verified",i.index.length,r.index.length)'
      - name: Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/items/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Publish XPZ o1.1.1 item and research data"
            git push
          fi

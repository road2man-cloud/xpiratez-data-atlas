name: Build item and research atlas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-item-research.yml"
      - "tools/build-data.mjs"
      - "tools/check-data.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xpiratez-data-atlas-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Download official X-Piratez v.o1.1.1
        uses: suisei-cn/actions-download-file@9f75b8c2dad5ccced7509c44a3b881c5613abde2
        with:
          url: "https://www.moddb.com/downloads/mirror/311212/122/9567434b123f2dee7ae07ee25d0ffa89/?referer=https%3A%2F%2Fwww.moddb.com%2Fmods%2Fx-piratez%2Fdownloads%2Fxpz-o1-19-jun-2026-reincarnated-in-another-world-but-everything-here-is-ai-slop"
          target: ".cache/xpz"
          filename: "xpiratez.rar"
          retry-times: 4
      - name: Inspect downloaded file
        run: |
          ls -lh .cache/xpz/xpiratez.rar
          file .cache/xpz/xpiratez.rar
          md5sum .cache/xpz/xpiratez.rar
          head -c 2000 .cache/xpz/xpiratez.rar || true
          exit 1
      - name: Extract ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p .cache/unpacked
          unar -q -o .cache/unpacked .cache/xpz/xpiratez.rar
          META=$(find .cache/unpacked -type f -path "*/user/mods/Piratez/metadata.yml" -print -quit)
          test -n "$META"
          MOD_PATH=${META%/metadata.yml}
          echo "XPIRATEZ_MOD_PATH=$MOD_PATH" >> "$GITHUB_ENV"
      - name: Generate database
        run: |
          npm run build:data -- --source "$XPIRATEZ_MOD_PATH"
          npm run check
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

name: Verify item and research data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-item-research.yml"
      - "tools/publish-item-research.sh"
      - "tools/test-publish-item-research.py"
      - "tools/build-item-research-data.mjs"
      - "tools/data-normalize.mjs"
      - "tools/check-item-research-data.mjs"
      - "tools/check-editorial-quality.mjs"
      - "tools/migrate-research-insight-sidecars.mjs"
      - "tools/build-research-editorial-insights.mjs"
      - "tools/research-decision-insights.mjs"
      - "tools/research-context.mjs"
      - "tools/check-research-decision-insights.mjs"
      - "tools/check-item-research-data.mjs"
      - "tools/build-item-editorial-insights.mjs"
      - "public/items/app.js"
      - "public/items/styles.css"
      - "public/items/index.html"
      - "public/research/index.html"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-item-research.yml"
      - "tools/publish-item-research.sh"
      - "tools/test-publish-item-research.py"
      - "tools/build-research-editorial-insights.mjs"
      - "tools/research-decision-insights.mjs"
      - "tools/research-context.mjs"
      - "tools/check-research-decision-insights.mjs"
      - "tools/check-item-research-data.mjs"
      - "public/items/app.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test publication isolation and concurrent updates
        run: python3 tools/test-publish-item-research.py

      - name: Migrate embedded research insights to sidecars
        run: node tools/migrate-research-insight-sidecars.mjs --data public/items/data

      - name: Generate GPT research and item editorials
        run: |
          node tools/build-research-editorial-insights.mjs --data public/items/data --out public/items/data
          node tools/build-item-editorial-insights.mjs --data public/items/data --out public/items/data

      - name: Verify migrated research DB and editorial quality
        run: |
          node tools/check-item-research-data.mjs --data public/items/data
          node tools/check-editorial-quality.mjs --data public/items/data
          node tools/check-research-decision-insights.mjs --data public/items/data


  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize this publisher; other main writers are handled by optimistic retries.
    concurrency:
      group: item-research-data-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish migrated research data with concurrent-update retries
        env:
          PUBLISH_ARTIFACT_DIR: ${{ runner.temp }}/research-publish-results
        run: bash tools/publish-item-research.sh

      - name: Preserve generated patches when publication fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-publish-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-publish-results
          if-no-files-found: ignore
          retention-days: 7

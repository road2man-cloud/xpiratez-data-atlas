name: XPZ3D R36HW N12 center-only geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n12-center-only-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n12.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n11-surface-relax-20261129/output/R36HW_N11_SKIN_RELAX.glb
            experimental/xpz3d/f11/r36hw-n12-center-only-20261129/
            .github/workflows/xpz3d-r36hw-n12.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate attached central geometry
        run: |
          node --check experimental/xpz3d/f11/r36hw-n12-center-only-20261129/source/build_r36hw_n12.cjs
          node experimental/xpz3d/f11/r36hw-n12-center-only-20261129/source/build_r36hw_n12.cjs
      - name: Check generated original-pelvis mesh
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='experimental/xpz3d/f11/r36hw-n12-center-only-20261129';
          const r=JSON.parse(fs.readFileSync(root+'/reports/R36HW_N12_CENTER_ATTACHED.json','utf8'));
          const b=fs.readFileSync(root+'/output/R36HW_N12_CENTER_ATTACHED.glb');
          if(r.trianglesAfter>2100||r.trianglesBefore!==1985||r.regionTrianglesSplit<35||r.regionTrianglesSplit>55||r.skinJoints!==63||!r.centralSurfaceRemainsOriginalPrimitive||r.sourceFaceHairUnmodified!==true||b.readUInt32LE(8)!==b.length)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.trianglesAfter,split:r.regionTrianglesSplit,vertices:r.newPelvisVertices,sha:r.outputSHA256}));
          NODE
      - name: Publish actual GLB and measured report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n12-center-only-20261129/output/R36HW_N12_CENTER_ATTACHED.glb experimental/xpz3d/f11/r36hw-n12-center-only-20261129/reports/R36HW_N12_CENTER_ATTACHED.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish center-only attached R36HW N12 GLB"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N12-center-only
          path: |
            experimental/xpz3d/f11/r36hw-n12-center-only-20261129/output/R36HW_N12_CENTER_ATTACHED.glb
            experimental/xpz3d/f11/r36hw-n12-center-only-20261129/reports/R36HW_N12_CENTER_ATTACHED.json

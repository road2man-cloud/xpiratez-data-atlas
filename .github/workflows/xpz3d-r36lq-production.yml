name: XPZ3D R36LQ tangent-space seam fairing production
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36lq-seam-fairing-20261128/source/**'
      - '.github/workflows/xpz3d-r36lq-production.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36lq-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36lq-seam-fairing-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce 2048x2048 cross-island albedo and normal seam fairing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36lq-seam-fairing-20261128
          INPUT=experimental/xpz3d/f11/r36lp-skin-rebake-20261128/output/balanced/R36LP_BALANCED_2100_FULL.glb
          node --check "$ROOT/source/build_r36lq.cjs"
          test -s "$INPUT"
          node --max-old-space-size=4096 "$ROOT/source/build_r36lq.cjs" "$INPUT" "$ROOT/output/balanced" balanced
          node --max-old-space-size=4096 "$ROOT/source/build_r36lq.cjs" "$INPUT" "$ROOT/output/soft" soft
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const mode of ['balanced','soft']){
            const stem='R36LQ_'+mode.toUpperCase()+'_2100_FULL',dir=path.join(process.argv[2],mode);
            const raw=fs.readFileSync(path.join(dir,stem+'.glb'));
            const r=JSON.parse(fs.readFileSync(path.join(dir,stem+'.report.json')));
            if(raw.toString('ascii',0,4)!=='glTF'||raw.readUInt32LE(8)!==raw.length||
               r.totalTriangles!==2100||r.bones!==63||r.affectedPixels<100||r.correctedEdgeCount<10)throw Error('invalid R36LQ '+mode);
            console.log(mode,'bytes',raw.length,'edges',r.correctedEdgeCount,'pixels',r.affectedPixels);
          }
          NODE
      - name: Preserve complete GLBs and 2048 atlas maps
        uses: actions/upload-artifact@v4
        with:
          name: R36LQ-seam-fairing-2100
          path: experimental/xpz3d/f11/r36lq-seam-fairing-20261128/output/
          retention-days: 90
      - name: Publish new GLBs and source maps to main
        shell: bash
        run: |
          set -euo pipefail
          DIR=experimental/xpz3d/f11/r36lq-seam-fairing-20261128/output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then echo "Unchanged"; exit 0; fi
          git commit -m "xpz3d: publish R36LQ complete seam-faired GLBs and textures"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Published R36LQ on main"
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

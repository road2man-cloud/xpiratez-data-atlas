name: XPZ3D R36HW N14 sewn three-pole center
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n14.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/output/R36HW_N13_CENTER_TOPOLOGY.glb
            experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/
            .github/workflows/xpz3d-r36hw-n14.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce 3-pole attached pelvic center
        run: |
          node --check experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/source/build_r36hw_n14.cjs
          node experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/source/build_r36hw_n14.cjs
      - name: Confirm actual geometry topology
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/reports/R36HW_N14_THREE_POLE_CENTER.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/output/R36HW_N14_THREE_POLE_CENTER.glb');
          if(r.trianglesBefore!==2095||r.trianglesAfter!==2099||r.addedTriangles!==4||r.originalHubDegree!==40||r.newHubVertices.length!==3||!r.manifoldInternalEdges||!r.boundaryEdgesPreserved||r.skinJoints!==63||!r.sourceFaceHairUnmodified||b.readUInt32LE(8)!==b.length)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.trianglesAfter,degrees:r.centerDegrees,sha256:r.outputSHA256}));
          NODE
      - name: Publish actual N14 GLB and topology audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/output/R36HW_N14_THREE_POLE_CENTER.glb experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/reports/R36HW_N14_THREE_POLE_CENTER.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish sewn three-pole original HW center GLB"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

name: XPZ3D R36MD semantic UV structure patches and sculpt normal maps
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36md-feature-texture-20261128/source/**'
      - '.github/workflows/xpz3d-r36md-feature-texture.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36md-feature-texture
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
            experimental/xpz3d/f11/r36ma-seam-rebake-20261128
            experimental/xpz3d/f11/r36mb-frame-transport-20261128
            experimental/xpz3d/f11/r36mc-landmark-sculpt-20261128
            experimental/xpz3d/f11/r36md-feature-texture-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce semantic contour-aligned UV image patches and full GLB
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36md-feature-texture-20261128
          SCRIPT=$ROOT/source/build_r36md.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SCRIPT"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            SRC="$BASE/r36mb-frame-transport-20261128/output/compact/R36MB_${V}_FLOW_2100_COMPACT_FULL.glb"
            for S in SCULPT GUARDED; do
              NAME="${V}_${S}"
              TARGET="$BASE/r36mc-landmark-sculpt-20261128/output/compact/R36MC_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              node --max-old-space-size=6144 "$SCRIPT" "$SRC" "$TARGET" "$OUT"
              node "$COMPACT" "$OUT/R36MD_SEMANTIC_2100_FULL.glb" "$ROOT/output/compact/R36MD_${NAME}_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['SCULPT','GUARDED']){
            const name=v+'_'+s,r=JSON.parse(fs.readFileSync(path.join(dir,name,'R36MD_SEMANTIC.report.json')));
            const b=fs.readFileSync(path.join(dir,'compact','R36MD_'+name+'_2100_COMPACT_FULL.glb'));
            if(r.triangles!==2100||r.joints!==63||r.semanticImageRegions<5||r.transport.changedPixels<500||
              b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('R36MD incomplete '+name);
            console.log(name,r.semanticImageRegions,r.regions.map(x=>x.triangles),r.transport.changedPixels);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MD-semantic-mesh-UV-textures
          path: experimental/xpz3d/f11/r36md-feature-texture-20261128/output/
          retention-days: 90
      - name: Publish actual semantic image patches and compact models
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36md-feature-texture-20261128/output
          rm -f "$ROOT"/ART_SCULPT/*.glb "$ROOT"/ART_GUARDED/*.glb
          rm -f "$ROOT"/SUBTLE_SCULPT/*.glb "$ROOT"/SUBTLE_GUARDED/*.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36MD semantic image patches with real sculpted GLBs"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

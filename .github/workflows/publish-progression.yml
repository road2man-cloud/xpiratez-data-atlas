name: Verify progression data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-progression.yml"
      - "public/data/progression.json"
      - "public/data/progression-research.json"
      - "public/data/progression-plans/**"
      - "public/soldiers/**"
      - "public/crafts/**"
      - "tools/build-data.mjs"
      - "tools/check-progression.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpiratez-progression-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify compact progression data
        run: |
          node tools/check-progression.mjs --data public/data
          node --check public/soldiers/app.js
          node --check public/crafts/app.js

name: XPZ3D R36HW N11 CLAY render
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n11-render.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n11-surface-relax-20261129/output/R36HW_N11_SKIN_RELAX.glb
            experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/
            .github/workflows/xpz3d-r36hw-n11-render.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render 12 actual N11 GLB diagnostic images
        run: |
          node --check experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/source/render_n11.cjs
          rm -rf experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/output
          node experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/source/render_n11.cjs experimental/xpz3d/f11/r36hw-n11-surface-relax-20261129/output/R36HW_N11_SKIN_RELAX.glb experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/output
      - name: Confirm N11 triangle and image output
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/output/R36HW_N11_RENDER.report.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.totalTriangles!==1985||r.images.length!==12||r.images.some(im=>im.bytes<4000))throw Error(JSON.stringify({triangles:r.totalTriangles,images:r.images}));
          console.log(JSON.stringify({triangles:r.totalTriangles,images:r.images.length,sha256:r.sourceSHA256}));
          NODE
      - name: Publish N11 CLAY and shaded captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n11-mesh-render-20261129/output
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): N11 actual-geometry CLAY and shaded views"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

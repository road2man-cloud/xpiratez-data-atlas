name: Diagnose XPedia source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-xpedia.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check metadata and current-only rules
        run: |
          set -eux
          curl -fsSL https://xpedia.netlify.app/user/mods/Piratez/metadata.yml -o /tmp/metadata.yml
          cat /tmp/metadata.yml
          curl -fsSL https://xpedia.netlify.app/user/mods/Piratez/Ruleset/Piratez.rul -o /tmp/Piratez.rul
          wc -c /tmp/Piratez.rul
          grep -n -m1 "STR_TACTICAL_CENTER" /tmp/Piratez.rul || true
          grep -n -m1 "STR_HOMEFRONT_SMG" /tmp/Piratez.rul || true

name: XPZ3D R36HW N19 actual lower-seam closeups
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/render_n19.cjs'
      - '.github/workflows/xpz3d-r36hw-n19-render.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/output/R36HW_N19_LOWER_SKIN_BRIDGE.glb
            experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/
            .github/workflows/xpz3d-r36hw-n19-render.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render genuine N19 center closeups
        run: |
          node --check experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/render_n19.cjs
          rm -rf experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/captures
          node experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/render_n19.cjs experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/output/R36HW_N19_LOWER_SKIN_BRIDGE.glb experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/captures
      - name: Check 12 images
        run: |
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/captures/R36HW_N19_RENDER.report.json','utf8'));
          if(r.totalTriangles!==2099||r.images.length!==12||r.images.some(i=>i.bytes<4000))throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.totalTriangles,images:r.images.length,sha:r.sourceSHA256}));
          NODE
      - name: Publish N19 real render diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/captures
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): N19 actual-center closeup captures"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

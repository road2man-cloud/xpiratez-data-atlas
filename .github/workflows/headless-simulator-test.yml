name: Native OXCE integrity and build (not combat validation)
on:
  push:
    branches: [main, feat/native-deterministic-clock-20261028]
    paths:
      - 'tools/headless-simulator/**'
      - '.github/workflows/headless-simulator-test.yml'
  pull_request:
    paths:
      - 'tools/headless-simulator/**'
      - '.github/workflows/headless-simulator-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: Native source integrity and fail-closed adapters
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/headless-simulator/native.test.mjs tools/headless-simulator/native-verification.test.mjs tools/headless-simulator/search-native.test.mjs tools/headless-simulator/generate-native-plans.test.mjs tools/headless-simulator/generate-native-turn-plans.test.mjs tools/headless-simulator/native-turn-beam.test.mjs tools/headless-simulator/prepare-runtime-assets.test.mjs tools/headless-simulator/prepare-runtime-archive.test.mjs
  native-build:
    name: Compile original OXCE ${{ matrix.variant }} (no battle run)
    needs: integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [rc18, rc17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsdl1.2-dev libsdl-image1.2-dev libsdl-gfx1.2-dev libsdl-mixer1.2-dev zlib1g-dev
      - name: Validate original OXCE headless-only audio mute patch
        run: node tools/headless-simulator/test-native-audio.mjs
      - name: Build fingerprinted source snapshot
        run: node tools/headless-simulator/build-native.mjs "$RUNNER_TEMP/xpz-native-${{ matrix.variant }}" 2 "${{ matrix.variant }}"
      - name: Publish native build artifact, not a gameplay certificate
        uses: actions/upload-artifact@v4
        with:
          name: xpz-native-linux-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/xpz-native-${{ matrix.variant }}/bundle/
          if-no-files-found: error

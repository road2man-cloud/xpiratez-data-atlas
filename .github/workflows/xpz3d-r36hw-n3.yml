name: XPZ3D R36HW N3 curvature
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n3-curvature-20261128/source/**'
      - '.github/workflows/xpz3d-r36hw-n3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kp/reference/R36HW_F11_CLOTHED.glb
            experimental/xpz3d/f11/r36hw-n3-curvature-20261128/
            .github/workflows/xpz3d-r36hw-n3.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce N3 GLB from original HW model
        run: node experimental/xpz3d/f11/r36hw-n3-curvature-20261128/source/build_r36hw_n3.cjs
      - name: Enforce original preservation and mesh budget
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n3-curvature-20261128/reports/R36HW_N3_CURVATURE.json','utf8'));
          if(r.originalTriangles!==2098||r.resultTriangles>2100||r.resultTriangles<1990||r.selectedTriangles<48||r.retainedSkinJoints!==63||r.unchangedFaceTriangles!==644||r.unchangedHairTriangles!==294||r.retouchedPrimitives.length!==3)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.resultTriangles,selected:r.selectedTriangles,retouched:r.retouchedPrimitives,sha256:r.outputSha256}));
          NODE
      - name: Publish binary and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n3-curvature-20261128/output/R36HW_N3_CURVATURE.glb experimental/xpz3d/f11/r36hw-n3-curvature-20261128/reports/R36HW_N3_CURVATURE.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish R36HW N3 curvature GLB"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N3-curvature
          path: |
            experimental/xpz3d/f11/r36hw-n3-curvature-20261128/output/R36HW_N3_CURVATURE.glb
            experimental/xpz3d/f11/r36hw-n3-curvature-20261128/reports/R36HW_N3_CURVATURE.json

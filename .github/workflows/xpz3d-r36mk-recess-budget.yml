name: XPZ3D R36MK recess-priority triangle reallocation
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36mk-recess-budget-20261128/source/**'
      - '.github/workflows/xpz3d-r36mk-recess-budget.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36mk-recess-budget
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36mc-landmark-sculpt-20261128
            experimental/xpz3d/f11/r36mf-integrated-20261128
            experimental/xpz3d/f11/r36mj-depth-layers-20261128
            experimental/xpz3d/f11/r36mk-recess-budget-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce balanced physical recess triangles and clay models
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36mk-recess-budget-20261128
          SRC=$ROOT/source/build_r36mk.cjs
          CLAY=$BASE/r36mf-integrated-20261128/source/create_clay.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SRC"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            for STYLE in DENSE GUARDED; do
              NAME="${V}_${STYLE}"
              INPUT="$BASE/r36mj-depth-layers-20261128/output/compact/R36MJ_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              MODE=strong
              [ "$STYLE" = GUARDED ] && MODE=guarded || true
              node --max-old-space-size=4096 "$SRC" "$INPUT" "$OUT" 10 "$MODE"
              UPPER=$(echo "$MODE" | tr '[:lower:]' '[:upper:]')
              node "$CLAY" "$OUT/R36MK_${UPPER}_2100_FULL.glb" "$OUT/R36MK_CLAY_2100_FULL.glb"
              node "$COMPACT" "$OUT/R36MK_${UPPER}_2100_FULL.glb" "$ROOT/output/compact/R36MK_${NAME}_2100_COMPACT_FULL.glb"
              node "$COMPACT" "$OUT/R36MK_CLAY_2100_FULL.glb" "$ROOT/output/compact/R36MK_${NAME}_CLAY_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['DENSE','GUARDED']){
            const mode=s==='DENSE'?'STRONG':'GUARDED',name=v+'_'+s;
            const r=JSON.parse(fs.readFileSync(path.join(root,name,'R36MK_'+mode+'.report.json')));
            if(r.trianglesAfter!==2100||r.joints!==63||r.donorEdgeCollapses<2||
              r.netFaceChange!==0||r.donorFacesRemoved!==r.recipientFacesAdded||
              r.recessRecipientTriangles<Math.ceil(r.recipientTrianglesSplit*.5))throw Error('invalid recess budget '+name);
            for(const suffix of ['','_CLAY']){
              const p=path.join(root,'compact','R36MK_'+name+suffix+'_2100_COMPACT_FULL.glb');
              const b=fs.readFileSync(p);
              if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('invalid GLB '+p);
            }
            console.log(name,'recess',r.recessRecipientTriangles,'other',r.ridgeRecipientTriangles);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MK-recess-budget-transfer-and-clay
          path: experimental/xpz3d/f11/r36mk-recess-budget-20261128/output/
          retention-days: 90
      - name: Publish compact GLBs, PNG and metrics
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36mk-recess-budget-20261128/output
          for V in ART SUBTLE; do for S in DENSE GUARDED; do rm -f "$ROOT/${V}_${S}"/*.glb; done; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36MK recess-targeted physical polygon allocation"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

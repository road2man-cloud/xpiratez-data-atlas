name: XPZ3D R36HW N18 front-visible geometry scan
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/scan_visible.cjs'
      - '.github/workflows/xpz3d-r36hw-n18-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n17-skin-field-20261129/output/R36HW_N17_CENTER_DEPTH.glb
            experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/
            .github/workflows/xpz3d-r36hw-n18-scan.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sample actual visible N17 pelvic triangles
        run: |
          node --check experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/scan_visible.cjs
          node experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/source/scan_visible.cjs experimental/xpz3d/f11/r36hw-n17-skin-field-20261129/output/R36HW_N17_CENTER_DEPTH.glb experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/reports/N17_VISIBLE_SURFACE.json
      - name: Publish front visible N17 geometry report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/reports/N17_VISIBLE_SURFACE.json
          if ! git diff --cached --quiet; then
            git commit -m "analysis(f11): record actual N17 front-visible triangle map"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

name: Build V15 N19 center garment relief
on:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-v15-n19-relief.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore pinned V14
        run: |
          git fetch --no-tags --depth=1 origin ae22741b095601ce6a6cfe42e12815d7d3fc3453
          file=experimental/xpz3d/f11/r36hw-athletic-v14-shoulder-20261129/output/R36HW_F11_ATHLETIC_SUIT_V14_SHOULDER.glb
          mkdir -p "$(dirname "$file")"
          git show ae22741b095601ce6a6cfe42e12815d7d3fc3453:"$file" > "$file"
      - name: Produce V15 GLB
        run: |
          node experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/source/build.cjs \
            experimental/xpz3d/f11/r36hw-athletic-v14-shoulder-20261129/output/R36HW_F11_ATHLETIC_SUIT_V14_SHOULDER.glb \
            experimental/xpz3d/f11/r36hw-n20-v10-nude-profile-20261129/output/R36HW_N20_V10_BODY_N19_CENTER.glb \
            experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/output/R36HW_F11_ATHLETIC_SUIT_V15_N19_RELIEF.glb
      - uses: actions/upload-artifact@v4
        with:
          name: r36hw-v15-n19-relief
          path: experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/
      - name: Publish generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/output experimental/xpz3d/f11/r36hw-athletic-v15-n19-relief-20261129/reports
          if ! git diff --cached --quiet; then
            git commit -m "build(xpz3d): V15 opaque relief output"
            git push origin HEAD:main
          fi
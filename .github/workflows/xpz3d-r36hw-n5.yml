name: XPZ3D R36HW N5 source skin seam repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/source/**'
      - '.github/workflows/xpz3d-r36hw-n5.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/output/R36HW_N4_SKIN_DETAIL.glb
            experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/
            .github/workflows/xpz3d-r36hw-n5.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct original skin boundary bridge and unify microtexture
        run: |
          node --check experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/source/build_r36hw_n5.cjs
          node experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/source/build_r36hw_n5.cjs
      - name: Confirm actual production data
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/reports/R36HW_N5_SEAM_LINK.json','utf8'));
          if(r.inputTriangles!==2076||r.newTriangles>2100||r.addedSeamTriangles<4||r.exposedSkinVerticesTextured!==230||r.newPrimitiveCount!==10||r.skinJointCount!==63||!r.originalFacePreserved||!r.originalHairPreserved)throw Error(JSON.stringify(r));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/output/R36HW_N5_SEAM_LINK.glb');
          const j=JSON.parse(b.toString('utf8',20,20+b.readUInt32LE(12)));
          if(j.meshes[0].primitives[6].attributes.TEXCOORD_0===undefined||j.meshes[0].primitives.length!==10||b.readUInt32LE(8)!==b.length)throw Error('GLB integrity');
          console.log(JSON.stringify({triangles:r.newTriangles,newTri:r.addedSeamTriangles,budget:r.remainingTriangleBudget,sha256:r.outputSha256}));
          NODE
      - name: Publish N5 GLB and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/output/R36HW_N5_SEAM_LINK.glb experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/reports/R36HW_N5_SEAM_LINK.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish N5 source skin seam GLB"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N5-native-skin-seam
          path: |
            experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/output/R36HW_N5_SEAM_LINK.glb
            experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/reports/R36HW_N5_SEAM_LINK.json

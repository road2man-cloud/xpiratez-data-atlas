name: XPZ3D R36LU image texture UV gutter
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36lt-texture-projection-20261128/source/build_r36lu_uv_gutter.cjs'
      - '.github/workflows/xpz3d-r36lu-uv-gutter.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36lu-uv-gutter
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate image-map gutters and compact GLBs
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36lt-texture-projection-20261128
          SCRIPT=$ROOT/source/build_r36lu_uv_gutter.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SCRIPT"
          rm -rf "$ROOT/output/r36lu"
          mkdir -p "$ROOT/output/r36lu/compact"
          for V in ART SUBTLE; do
            MODE=$(echo "$V" | tr '[:upper:]' '[:lower:]')
            SOURCE="$BASE/r36ls-illustrated-skin-20261128/output/compact/R36LS_${V}_2100_COMPACT_FULL.glb"
            OUT="$ROOT/output/r36lu/$MODE"
            node --max-old-space-size=4096 "$SCRIPT" "$SOURCE" "$OUT" 8
            node "$COMPACT" "$OUT/R36LU_UVGUTTER_2100_FULL.glb" "$ROOT/output/r36lu/compact/R36LU_${V}_UVGUTTER_2100_COMPACT_FULL.glb"
          done
          node - "$ROOT/output/r36lu" <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2];
          for(const v of ['art','subtle']){
            const r=JSON.parse(fs.readFileSync(path.join(dir,v,'R36LU_UVGUTTER.report.json')));
            const b=fs.readFileSync(path.join(dir,'compact','R36LU_'+v.toUpperCase()+'_UVGUTTER_2100_COMPACT_FULL.glb'));
            if(r.totalTriangles!==2100||r.rigJoints!==63||r.paddedUVPixels<1000||b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('invalid R36LU '+v);
            console.log(v,r.paddedUVPixels,b.length);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36LU-UVGUTTER-ART-SUBTLE
          path: experimental/xpz3d/f11/r36lt-texture-projection-20261128/output/r36lu/
          retention-days: 90
      - name: Publish PNG texture maps and compact GLBs
        shell: bash
        run: |
          set -euo pipefail
          DIR=experimental/xpz3d/f11/r36lt-texture-projection-20261128/output/r36lu
          rm -f "$DIR"/art/*.glb "$DIR"/subtle/*.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36LU UV-gutter image maps and GLBs"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

name: XPZ3D R36MF integrate contour-oriented texture with redistributed mesh
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36mf-integrated-20261128/source/**'
      - '.github/workflows/xpz3d-r36mf-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36mf-integrated
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
            experimental/xpz3d/f11/r36ma-seam-rebake-20261128
            experimental/xpz3d/f11/r36mb-frame-transport-20261128
            experimental/xpz3d/f11/r36mc-landmark-sculpt-20261128
            experimental/xpz3d/f11/r36md-feature-texture-20261128
            experimental/xpz3d/f11/r36me-density-20261128
            experimental/xpz3d/f11/r36mf-integrated-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate nonuniform semantic image detail on redistributed sculpt geometry
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36mf-integrated-20261128
          BUILDER=$BASE/r36md-feature-texture-20261128/source/build_r36md.cjs
          CLAY=$ROOT/source/create_clay.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$BUILDER"
          node --check "$CLAY"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            SRC="$BASE/r36mb-frame-transport-20261128/output/compact/R36MB_${V}_FLOW_2100_COMPACT_FULL.glb"
            for S in DENSE GUARDED; do
              NAME="${V}_${S}"
              TARGET="$BASE/r36me-density-20261128/output/compact/R36ME_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              node --max-old-space-size=6144 "$BUILDER" "$SRC" "$TARGET" "$OUT"
              node "$CLAY" "$OUT/R36MD_SEMANTIC_2100_FULL.glb" "$OUT/R36MF_CLAY_2100_FULL.glb"
              node "$COMPACT" "$OUT/R36MD_SEMANTIC_2100_FULL.glb" "$ROOT/output/compact/R36MF_${NAME}_2100_COMPACT_FULL.glb"
              node "$COMPACT" "$OUT/R36MF_CLAY_2100_FULL.glb" "$ROOT/output/compact/R36MF_${NAME}_CLAY_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['DENSE','GUARDED']){
            const k=v+'_'+s,rep=JSON.parse(fs.readFileSync(path.join(root,k,'R36MD_SEMANTIC.report.json')));
            if(rep.triangles!==2100||rep.joints!==63||rep.semanticImageRegions<5)throw Error('semantic feature creation failed '+k);
            for(const clay of [false,true]){
              const name='R36MF_'+k+(clay?'_CLAY':'')+'_2100_COMPACT_FULL.glb';
              const b=fs.readFileSync(path.join(root,'compact',name));
              if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('Invalid output '+name);
              console.log(name,b.length);
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MF-clay-and-structured-texture-on-redistributed-3d
          path: experimental/xpz3d/f11/r36mf-integrated-20261128/output/
          retention-days: 90
      - name: Publish final candidate GLB and semantic image patches
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36mf-integrated-20261128/output
          for V in ART SUBTLE; do for S in DENSE GUARDED; do rm -f "$ROOT/${V}_${S}"/*.glb; done; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish integrated R36MF semantic-texture skinned and clay GLBs"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

name: XPZ3D R36HW N4 procedural material
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/source/**'
      - '.github/workflows/xpz3d-r36hw-n4.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n3-curvature-20261128/output/R36HW_N3_CURVATURE.glb
            experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/
            .github/workflows/xpz3d-r36hw-n4.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build N4 skin-color and micro-normal materials in existing N3 GLB
        run: |
          node --check experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/source/build_r36hw_n4.cjs
          node experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/source/build_r36hw_n4.cjs
      - name: Validate material and non-regression constraints
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/reports/R36HW_N4_SKIN_DETAIL.json','utf8'));
          if(r.modelTriangles!==2076||r.skinJoints!==63||r.texturedPrimitives.length!==4||r.albedoTexture.pngBytes<10000||r.microNormalTexture.pngBytes<10000)throw Error(JSON.stringify(r));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/output/R36HW_N4_SKIN_DETAIL.glb');
          const j=JSON.parse(b.toString('utf8',20,20+b.readUInt32LE(12)));
          if(j.meshes[0].primitives.length!==9||!j.materials.some(x=>x.name==='R36HW_N4_procedural_skin_shells'&&x.normalTexture&&x.pbrMetallicRoughness.baseColorTexture))throw Error('Material missing');
          console.log(JSON.stringify({triangles:r.modelTriangles,images:j.images.length,outputBytes:b.length,sha256:r.outputSha256}));
          NODE
      - name: Publish produced GLB and material report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/output/R36HW_N4_SKIN_DETAIL.glb experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/reports/R36HW_N4_SKIN_DETAIL.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish N4 material-enhanced GLB"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N4-GLB-material
          path: |
            experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/output/R36HW_N4_SKIN_DETAIL.glb
            experimental/xpz3d/f11/r36hw-n4-skin-material-20261128/reports/R36HW_N4_SKIN_DETAIL.json

name: XPZ3D R36HW N7 actual mesh frames
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/source/**'
      - '.github/workflows/xpz3d-r36hw-n7-actual-frames.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36hw-n7-continuous-hem-20261128
            experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render twelve actual R36HW N7 GLB frames
        run: |
          node --check experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/source/render_n7.cjs
          node experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/source/render_n7.cjs experimental/xpz3d/f11/r36hw-n7-continuous-hem-20261128/output/R36HW_N7_SOFT_HEM.glb experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/output
      - name: Confirm source model and view set
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/output',r=JSON.parse(fs.readFileSync(p+'/R36HW_N7_RENDER.report.json'));
          if(r.totalTriangles!==2080||r.images.length!==12||r.images.filter(x=>x.focus==='detail').length!==6||r.images.some(x=>x.bytes<3000))throw Error(JSON.stringify(r));
          for(const i of r.images)if(fs.statSync(p+'/'+i.file).size<3000)throw Error('Missing '+i.file);
          console.log(JSON.stringify({triangles:r.totalTriangles,images:r.images.length,sha:r.sourceSHA256}));
          NODE
      - name: Publish N7 actual geometry diagnostic PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/output
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish R36HW N7 source-rebased CLAY and shaded PNGs"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N7-actual-GLB-diagnostic-frames
          path: experimental/xpz3d/f11/r36hw-n7-actual-mesh-render-20261128/output

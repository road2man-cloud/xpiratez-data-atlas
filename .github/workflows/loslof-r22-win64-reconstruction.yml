name: OXCE 8.6.0 R25 Virtual Aim Parity Windows BETA
on:
  push:
    branches:
      - loslof-r25-virtual-aim-parity-20261015
    paths:
      - 'loslof_r22/**'
      - '.github/workflows/loslof-r22-win64-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout reconstruction scripts
        uses: actions/checkout@v4

      - name: Install MSYS2, GCC, CMake and SDL 1.2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_gfx
            mingw-w64-x86_64-SDL_image
            mingw-w64-x86_64-SDL_mixer

      - name: Fetch pinned upstream, fail on changed engine revision
        shell: msys2 {0}
        run: |
          git init engine
          git -C engine remote add origin https://github.com/MeridianOXC/OpenXcom.git
          git -C engine fetch --depth=1 origin 3e722e09b655ab67acfb59fc8585dc70b583826c
          git -C engine checkout --detach FETCH_HEAD
          test "$(git -C engine rev-parse HEAD)" = "3e722e09b655ab67acfb59fc8585dc70b583826c"
          grep -E 'OPENXCOM_VERSION_SHORT "Extended 8.6(\.0)?"' engine/src/version.h

      - name: Apply strict non-destructive R22 preview integration
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_preview.py engine

      - name: Add experimental engine Projectile sampler, NOT R21 parity
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_stats_EXPERIMENTAL.py engine

      - name: Apply R21 UX regression recovery beta (LOS hull, planned origin, Z HUD)
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_recovery_beta.py engine

      - name: Hardening - native kneel stance, no hidden units, pellet -2, cache
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_safety.py engine

      - name: Restore R21 throwing native range and cached parabolic trajectory
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_throw.py engine

      - name: Preserve native clicks, backslash virtual stance, native confirmed target and concise HUD
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_native_targeting.py engine

      - name: Match native voxel aim and suppress impossible first-shot bursts
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_native_ballistic_aim.py engine

      - name: Repair window throw collision and unlock instant grenades after new game
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_throw_window_and_grenade_options.py engine

      - name: Port R21 isolated preview RNG to R22 sampler without changing gameplay
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r22_r21_local_rng.py engine

      - name: Fix upstream static SDL linkage for MSYS2 MinGW64 DLL imports
        shell: msys2 {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("engine/src/CMakeLists.txt")
          original = p.read_text(encoding="utf-8")
          updated, number = re.subn(r"set\s*\(\s*static_flags\s+-static\s*\)",
                                    "set ( static_flags )", original)
          if number != 1:
              raise SystemExit(f"Expected exactly one upstream MinGW '-static' flag, found {number}")
          p.write_text(updated, encoding="utf-8")
          print("Removed upstream -static so MSYS2 SDL 1.2 import libraries and DLLs can link")
          PY

      - name: Run original R22 static regression gates before changing research UI
        shell: msys2 {0}
        run: |
          python loslof_r22/tests/check_integrated_r22.py engine
          python loslof_r22/tests/check_collision_hardening.py engine
          python loslof_r22/tests/check_progressive_montecarlo.py engine
          python loslof_r22/tests/check_native_targeting_input.py engine
          python loslof_r22/tests/check_native_targeting.py engine
          python loslof_r22/tests/check_native_ballistic_aim.py engine
          python loslof_r22/tests/check_throw_window_and_grenade_options.py engine
          python loslof_r22/tests/check_r21_local_rng.py engine
          python -m py_compile loslof_r22/tools/patch_r22_preview.py loslof_r22/tools/patch_r22_stats_EXPERIMENTAL.py loslof_r22/tools/patch_r22_recovery_beta.py loslof_r22/tools/patch_r22_safety.py loslof_r22/tools/patch_r22_throw.py loslof_r22/tools/patch_r22_native_targeting.py loslof_r22/tools/patch_r22_native_ballistic_aim.py loslof_r22/tools/patch_r22_throw_window_and_grenade_options.py loslof_r22/tools/patch_r22_r21_local_rng.py

      - name: Apply R23 read-only research cost UI after R22 regression checks
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r23_research_cost.py engine
          python loslof_r22/tests/check_r23_research_cost.py engine
          python -m py_compile loslof_r22/tools/patch_r23_research_cost.py loslof_r22/tests/check_r23_research_cost.py

      - name: Add R24 current research spent RP and completion percentage
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r24_research_progress.py engine
          python loslof_r22/tests/check_r24_research_progress.py engine
          python -m py_compile loslof_r22/tools/patch_r24_research_progress.py loslof_r22/tests/check_r24_research_progress.py

      - name: Apply R25 native-equivalent virtual range and LOS preview patch
        shell: msys2 {0}
        run: |
          python loslof_r22/tools/patch_r25_virtual_accuracy.py engine
          python loslof_r22/tests/check_r25_virtual_accuracy.py engine
          python -m py_compile loslof_r22/tools/patch_r25_virtual_accuracy.py loslof_r22/tests/check_r25_virtual_accuracy.py

      - name: Configure MinGW64 (actual OXCE engine)
        shell: msys2 {0}
        run: |
          cmake -G Ninja -S engine -B build -DCMAKE_BUILD_TYPE=Release -DDEV_BUILD=OFF -DBUILD_PACKAGE=OFF

      - name: Compile engine executable
        shell: msys2 {0}
        run: |
          cmake --build build --parallel 4
          test -s build/bin/openxcom.exe

      - name: Launch real Windows EXE in CLI version smoke test
        shell: msys2 {0}
        run: |
          ./build/bin/openxcom.exe -version
          test -s build/bin/openxcom.exe

      - name: Recursively collect non-system DLLs, package proof and hashes
        shell: msys2 {0}
        run: |
          python - <<'PY'
          import hashlib, os, re, shutil, subprocess
          from pathlib import Path
          exe = Path("build/bin/openxcom.exe")
          assert exe.is_file(), "Missing Windows executable"
          out = Path("dist")
          out.mkdir(exist_ok=True)
          result = out / "OpenXcomEx_LOSLOF_R25_VIRTUAL_AIM_PARITY_BETA.exe"
          shutil.copy2(exe, result)
          pending = [result]
          visited = set()
          prefix = Path("/mingw64/bin")
          while pending:
              binary = pending.pop()
              imports = subprocess.check_output(["objdump", "-p", str(binary)], text=True, errors="replace")
              for dll in re.findall(r"^\s*DLL Name:\s*(\S+)", imports, flags=re.MULTILINE):
                  low = dll.lower()
                  if low in visited:
                      continue
                  visited.add(low)
                  src = prefix / dll
                  if not src.exists():
                      candidates = [p for p in prefix.glob("*.dll") if p.name.lower() == low]
                      src = candidates[0] if candidates else src
                  if src.is_file():
                      dst = out / src.name
                      shutil.copy2(src, dst)
                      pending.append(dst)
          shutil.copy2("engine/LICENSE.txt", out/"OXCE_GPL_LICENSE.txt")
          (out/"UNVERIFIED.txt").write_text(
              "OXCE 8.6.0 pinned upstream 3e722e09b655ab67acfb59fc8585dc70b583826c\n"
              "R22 RECOVERY BETA: large-unit fixes plus 1024 progressive HBM, 384 risk, 256-frame trace budget and hatching.\n"
              "R23 RESEARCH UI: new-project base RP and chosen/current actual RP; research logic unchanged.\n"
              "R24 PROGRESS UI: current research spent RP, actual total RP and completion percentage; research logic unchanged.\n"
              "R25 VIRTUAL AIM: native tile range/distance, virtual LOS penalty, and preview-only projectile LOS override.\n"
              "NOT equivalent to R21. H/B/M, shotgun, burst and risk are APPROXIMATE EXPERIMENTS;\n"
              "compatibility have NOT been validated. DO NOT replace your original executable.\n",
              encoding="utf-8")
          (out/"BUILD_PROVENANCE.txt").write_text(
              "Status: R25 virtual aim range/LOS parity on R24 + R23 + R22 Virtual Origin Fix Beta (NOT R21-equivalent)\\n"
              "Pinned engine: OpenXcom Extended 8.6.0\\n"
              "Upstream engine commit: 3e722e09b655ab67acfb59fc8585dc70b583826c\\n"
              "R22 pinned source patch commit: 6161db7e26cf95197121136137610ab07ee763bd\\n"
              "R23 pinned source patch commit: 7b5ef9775e3c73230786c08d7bc6ab2b48de0f80\\n"
              "R24 pinned source patch commit: 8fbfb976503edee4be2c2a919f3634e75da3b409\\n"
              f"R25 patch repository commit: {os.environ.get('GITHUB_SHA','UNKNOWN')}\\n"
              f"GitHub Actions run ID: {os.environ.get('GITHUB_RUN_ID','UNKNOWN')}\\n"
              "Patch chain: preview > stats > recovery > safety > throw > native targeting (valid virtual cursor) > native ballistic aim > window throw/live grenade option > R21 isolated preview RNG > R23 research cost UI > R24 research progress UI > R25 virtual aim range/LOS\\n"
              "CI checks: static regression, compiler, EXE -version CLI smoke test.\\n"
              "NOT checked: real XPiratez fights, input device handling, numerical calibration, R21 parity.\\n",
              encoding="utf-8")
          (out/"HOW_TO_USE_KO.txt").write_text(
              "XPiratez LOS/LOF R25 Virtual Aim Parity Beta - safety-first test guide\\n"
              "1. Do NOT overwrite your original XPiratez EXE, DLLs, or saves.\\n"
              "2. Make a separate COPY of the existing XPiratez installation for testing.\\n"
              "3. Extract this artifact's EXE and DLLs ONLY into that separate copy.\\n"
              "4. Use separate USER and CONFIG folders to avoid touching original saves/config.\\n"
              "   Example: EXE_NAME -user C:\\\\XPiratez-R22-Test\\\\User -config C:\\\\XPiratez-R22-Test\\\\Config\\n"
              "   If game data is not detected, pass -data with your copied game-data path.\\n"
              "5. Enable XPiratez mod in isolated configuration and load a COPY of a test save.\\n"
              "6. F8 toggles passive preview. Normal movement, selection and both clicks remain native.\\n"
              "7. In SNAP / AIMED / AUTO aim, hover for ACC~ and H/B/M estimates.\\n"
              "8. With Confirm Fire enabled, click target once to preview native lock, again to shoot.\\n"
              "9. During targeting, backslash toggles virtual STAND/KNEEL without TU use.\\n"
              "   Virtual stance has a small left indicator; label width stays five letters.\\n"
              "   Palette-adaptive dark HUD plate and bright letters prevent terrain camouflage.\\n"
              "   After first target click, H/B/M always samples from the CURSOR source tile.\\n"
              "   Direct-voxel scan failure never hides H/B/M; blocked paths give high B.\\n"
              "   A valid cursor tile is sampled even when its floor is not marked discovered.\\n"
              "10. THROW shows nominal ARC CLEAR / ARC BLOCKED (not guaranteed landing).\\n"
              "   Windows and walls block throws under actual native collision rules.\\n"
              "   Game Options > Advanced > OXC > Battlescape > Instant Grenades may be changed in an existing campaign.\\n"
              "   Only fuse-zero eligible grenades are affected; save Options with OK.\\n"
              "11. New research screen: right column is BASE RP from the ruleset.\\n"
              "    After opening an unstarted project, RP TOTAL is its rolled ACTUAL requirement (50-150% of base).\\n"
              "    Current research list [N] and project dialog show definitive total RP from the save.\\n"
              "    RP spent / total in current project dialog does NOT change the saved research cost.\\n"
              "12. Current research list: project title [N] is the ACTUAL total research points.\\n"
              "    Progress column shows already SPENT points (PERCENT%) from the savegame.\\n"
              "    Opening an existing project shows RP: SPENT / ACTUAL TOTAL (PERCENT%).\\n"
              "    Completion is rounded down to integer percent and capped at 100%; zero-cost projects show 100%.\\n"
              "    Research RNG, scientist allocation and savegame format remain unchanged.\\n"
              "13. Virtual source cursor preview ACC~ now applies OXCE native tile range dropoff and max range.\\n"
              "    H/B/M sampling uses LOS from virtual source (including smoke/light), not real actor location.\\n"
              "    Native crosshair ACC on virtual SOURCE cursor is suppressed to avoid false comparisons.\\n"
              "    H is a Monte Carlo hit estimate, not the same quantity as crosshair ACC; samples vary.\\n"
              "    Exact parity still requires real-save live validation, including custom visibility scripts and terrain.\\n"
              "14. Never use an unverified beta executable for your only campaign save.\\n"
              "15. Verify SHA256SUMS.txt before use; see BUILD_PROVENANCE.txt for exact source.\\n"
              "These percentages are EXPERIMENTAL and not validated against live hit rates.\\n",
              encoding="utf-8")
          manifest = []
          for p in sorted(out.iterdir()):
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              manifest.append(f"{digest}  {p.name}")
          (out/"SHA256SUMS.txt").write_text("\n".join(manifest)+"\n",encoding="utf-8")
          print("Package files:")
          for p in sorted(out.iterdir()):
              print(p.name, p.stat().st_size)
          PY

      - name: Upload unverified Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOSLOF-R25-VIRTUAL-AIM-PARITY-BETA-WIN64
          path: dist/
          if-no-files-found: error
          retention-days: 21

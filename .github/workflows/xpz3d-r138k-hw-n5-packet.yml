name: XPZ3D R138K native S2 N5 seam geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r138k-hw-n5-native-20261128/source/**'
      - '.github/workflows/xpz3d-r138k-hw-n5-packet.yml'
permissions:
  contents: write
jobs:
  packet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n5-skin-seams-20261128/output/R36HW_N5_SEAM_LINK.glb
            experimental/xpz3d/f11/r138k-hw-n5-native-20261128/
            .github/workflows/xpz3d-r138k-hw-n5-packet.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export actual N5 to native S2 static packet
        run: |
          node --check experimental/xpz3d/f11/r138k-hw-n5-native-20261128/source/build_native_packet.cjs
          node experimental/xpz3d/f11/r138k-hw-n5-native-20261128/source/build_native_packet.cjs
      - name: Check S2 packet and bridge geometry preservation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='experimental/xpz3d/f11/r138k-hw-n5-native-20261128/output/R36HW_N5_STATIC_XPZC.bin';
          const b=fs.readFileSync(p);
          const r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r138k-hw-n5-native-20261128/reports/R36HW_N5_STATIC_XPZC.json','utf8'));
          if(b.toString('ascii',0,4)!=='XPZC'||b.readUInt32LE(8)!==10||b.readUInt32LE(12)!==2080||r.parts!==10||r.modelOriginalJoints!==63||r.groups[9].triangles!==4||r.groups[9].kind!==0)throw Error('Native packet mismatch');
          console.log(JSON.stringify({triangles:r.triangles,parts:r.parts,group9:r.groups[9],sha256:r.packetSha256}));
          NODE
      - name: Publish S2 packet and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r138k-hw-n5-native-20261128/output/R36HW_N5_STATIC_XPZC.bin experimental/xpz3d/f11/r138k-hw-n5-native-20261128/reports/R36HW_N5_STATIC_XPZC.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish S2 static 2080-triangle N5 packet"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N5-S2-packet
          path: |
            experimental/xpz3d/f11/r138k-hw-n5-native-20261128/output/R36HW_N5_STATIC_XPZC.bin
            experimental/xpz3d/f11/r138k-hw-n5-native-20261128/reports/R36HW_N5_STATIC_XPZC.json

name: XPZ3D R36HW N17 actual center-only captures
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n17-center-render-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n17-render.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n17-skin-field-20261129/output/R36HW_N17_CENTER_DEPTH.glb
            experimental/xpz3d/f11/r36hw-n17-center-render-20261129/
            .github/workflows/xpz3d-r36hw-n17-render.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate six actual N17 pelvic close-ups
        run: |
          node --check experimental/xpz3d/f11/r36hw-n17-center-render-20261129/source/render_n17.cjs
          rm -rf experimental/xpz3d/f11/r36hw-n17-center-render-20261129/output
          node experimental/xpz3d/f11/r36hw-n17-center-render-20261129/source/render_n17.cjs experimental/xpz3d/f11/r36hw-n17-skin-field-20261129/output/R36HW_N17_CENTER_DEPTH.glb experimental/xpz3d/f11/r36hw-n17-center-render-20261129/output
      - name: Check real GLB rendered frames
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='experimental/xpz3d/f11/r36hw-n17-center-render-20261129',r=JSON.parse(fs.readFileSync(root+'/output/R36HW_N17_RENDER.report.json','utf8'));
          if(r.totalTriangles!==2099||r.images.length!==12||r.images.some(x=>x.bytes<4000))throw Error(JSON.stringify({triangles:r.totalTriangles,images:r.images}));
          console.log(JSON.stringify({totalTriangles:r.totalTriangles,views:r.images.length,pelvisOnly:r.images.filter(x=>x.layer).length,sha:r.sourceSHA256}));
          NODE
      - name: Publish actual close-up PNGs and render report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n17-center-render-20261129/output
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): N17 actual center-geometry close-up renders"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

name: Deploy Data Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xpiratez-data-atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify atlas data and frontend
        run: |
          node tools/check-item-research-data.mjs --data public/items/data
          node tools/check-soldiers.mjs --data public/data
          if [ -f public/data/progression.json ]; then node tools/check-progression.mjs --data public/data; fi
          node tools/check-armors.mjs
          node tools/check-weapons.mjs
          node --check public/items/app.js
          node --check public/soldiers/app.js
          node --check public/crafts/app.js
          node --check public/armors/app.js
          node --check public/captains/app.js
          node --check public/weapons/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

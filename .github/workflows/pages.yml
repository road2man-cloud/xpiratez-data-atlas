name: Deploy Data Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xpiratez-data-atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install generator dependencies
        run: npm install

      - name: Resolve and download official X-Piratez v.o1.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/xpz
          START_URL="https://www.moddb.com/downloads/start/311212"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36"

          curl -fL --retry 4 --connect-timeout 20 -A "$UA"             -e "https://www.moddb.com/mods/x-piratez/downloads/xpz-o1-19-jun-2026-reincarnated-in-another-world-but-everything-here-is-ai-slop"             "$START_URL" -o .cache/xpz/start.html

          MIRROR_PATH="$(python - <<'PY'
import html
import re
from pathlib import Path
text=Path(".cache/xpz/start.html").read_text(encoding="utf-8",errors="replace")
m=re.search(r'href="([^"]*/downloads/mirror/311212/[^"]+)"',text)
if not m:
    raise SystemExit("Could not resolve the current ModDB mirror URL")
print(html.unescape(m.group(1)))
PY
)"
          if [[ "$MIRROR_PATH" == http* ]]; then
            MIRROR_URL="$MIRROR_PATH"
          else
            MIRROR_URL="https://www.moddb.com$MIRROR_PATH"
          fi
          echo "Resolved ModDB mirror endpoint: $MIRROR_URL"

          curl -fL --retry 4 --connect-timeout 20 -A "$UA"             -e "$START_URL"             "$MIRROR_URL"             -o .cache/xpz/Dioxine_XPiratez_o1.1.1.rar

      - name: Verify official archive
        run: echo "79c89ba604606b86614dcfeb0f376061  .cache/xpz/Dioxine_XPiratez_o1.1.1.rar" | md5sum -c -

      - name: Extract X-Piratez ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p .cache/unpacked
          unar -q -o .cache/unpacked .cache/xpz/Dioxine_XPiratez_o1.1.1.rar
          META=$(find .cache/unpacked -type f -path "*/user/mods/Piratez/metadata.yml" -print -quit)
          test -n "$META"
          MOD_PATH=${META%/metadata.yml}
          echo "XPIRATEZ_MOD_PATH=$MOD_PATH" >> "$GITHUB_ENV"

      - name: Build normalized item and research data
        run: |
          rm -rf public/data .cache/full-data
          node tools/build-item-research-data.mjs             --source "$XPIRATEZ_MOD_PATH"             --out public/data

      - name: Build soldier and armor data
        run: |
          node tools/build-data.mjs             --source "$XPIRATEZ_MOD_PATH"             --out .cache/full-data
          cp .cache/full-data/soldiers-index.json public/data/
          cp .cache/full-data/armors-index.json public/data/
          rm -rf public/data/armor-chunks public/data/resource-chunks/armors
          cp -r .cache/full-data/armor-chunks public/data/armor-chunks
          mkdir -p public/data/resource-chunks
          cp -r .cache/full-data/resource-chunks/armors public/data/resource-chunks/armors

      - name: Build weapon comparison data
        run: |
          node tools/build-weapons.mjs             --source "$XPIRATEZ_MOD_PATH"             --out public/data/weapons-index.json

      - name: Verify generated atlas data
        run: |
          node tools/check-data.mjs --data public/data
          node tools/check-armors.mjs
          node tools/check-weapons.mjs public/data/weapons-index.json
          node --check public/items/app.js
          node --check public/soldiers/app.js
          node --check public/armors/app.js
          node --check public/weapons/app.js
          node --check public/captains/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Sync Data Atlas Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xpiratez-data-atlas-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify atlas data and frontend
        run: |
          node tools/check-item-research-data.mjs --data public/items/data
          test ! -e public/data/items-index.json
          test ! -e public/data/research-index.json
          grep -Fq 'data-data-base="./data"' public/items/index.html
          grep -Fq 'data-data-base="../items/data"' public/research/index.html
          node tools/check-soldiers.mjs --data public/data
          node tools/check-progression.mjs --data public/data
          node tools/check-armors.mjs
          node tools/check-weapons.mjs
          node --check public/items/app.js
          node --check public/soldiers/app.js
          node --check public/crafts/app.js
          node --check public/armors/app.js
          node --check public/captains/app.js
          node --check public/weapons/app.js

      - name: Publish public tree to gh-pages
        run: |
          git fetch origin gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE=$(git rev-parse HEAD:public)
          PARENT=$(git rev-parse origin/gh-pages)
          COMMIT=$(echo "Publish public atlas from $GITHUB_SHA" | git commit-tree "$TREE" -p "$PARENT")
          git push origin "$COMMIT":refs/heads/gh-pages

name: Deploy Data Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xpiratez-data-atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify atlas data and frontend
        run: |
          node tools/check-item-research-data.mjs --data public/items/data
          node tools/check-soldiers.mjs --data public/data
          if [ -f public/data/progression.json ]; then node tools/check-progression.mjs --data public/data; fi
          node tools/check-armors.mjs
          node tools/check-weapons.mjs
          node --check public/items/app.js
          node --check public/soldiers/app.js
          node --check public/crafts/app.js
          node --check public/armors/app.js
          node --check public/captains/app.js
          node --check public/weapons/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish static site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf .pages-publish
          git worktree add --detach .pages-publish origin/gh-pages
          find .pages-publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a public/. .pages-publish/
          cd .pages-publish
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches public/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Data Atlas from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages

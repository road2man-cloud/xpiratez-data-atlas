name: Sync Data Atlas Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "modules/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xpiratez-data-atlas-pages-sync
  # Frequent data-worker commits must not starve a completed release.
  # Keep the current validated run; GitHub keeps the latest pending run.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install atlas verification dependencies
        run: npm install --no-save --package-lock=false playwright-core@1.64.0

      - name: Verify atlas data and frontend
        run: |
          # One canonical gate for all DB, choices, start bonuses, assets and JS.
          npm run check:no-legacy-rules
          npm run check
          node tools/check-branch-soldier-publication.mjs
          node tools/check-all-origin-cap12.mjs
          test ! -e public/data/items-index.json
          test ! -e public/data/research-index.json
          grep -Fq 'data-data-base="./data"' public/items/index.html
          grep -Fq 'data-data-base="../items/data"' public/research/index.html

      - name: Browser smoke for all 14 DBs and decision guides (mobile viewport)
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright-core install chromium
          fi
          node tools/check-site-browser.mjs --local
          # One 2.1 birth-origin catalog gate: provisional chronology evidence,
          # retired training redirects, directional research branches and no save inputs.
          node tools/check-soldier-modern-browser.mjs
          # Source-backed Chort eligibility table: 42 sources and distinct replay evidence.
          node tools/check-soldier-chort-readiness-browser.mjs
          # Readable, nontechnical default layer in all 14 DBs and birth guides.
          node tools/check-atlas-reader-guide-browser.mjs
          # Unified left-to-right steps, drawer navigation and wide-table controls.
          node tools/check-site-progressive-reader.mjs
          # Horizontal acquisition tech viewer: mobile + desktop, AND/OR wires,
          # shop and event source conditions, pan/zoom, lazy raw proof.
          node tools/check-acquisition-tech-view-browser.mjs
          # The legacy Research DB reuses the same viewer with a version-isolated source index.
          node tools/check-research-tech-browser.mjs
          # Legacy item acquisition: original price/store gates, manufacturing and event outcome uncertainty.
          node tools/check-item-acquisition-tech-browser.mjs
          # Deep mobile origin paths and full 42-case functional browser audit,
          # including original archive loading without DecompressionStream.
          node tools/check-origin-complete-condition-tree-browser.mjs
          node tools/check-site-functional.mjs

      - name: Publish public tree to gh-pages
        run: |
          git fetch origin gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep canonical item/research data only under public/items/data in main,
          # but publish legacy /data aliases so stale cached clients keep working.
          INDEX=$(mktemp)
          rm -f "$INDEX"
          trap 'rm -f "$INDEX"' EXIT
          export GIT_INDEX_FILE="$INDEX"
          git read-tree HEAD:public
          for name in items-index.json research-index.json entities.json schema.json manifest.json; do
            BLOB=$(git rev-parse "HEAD:public/items/data/$name")
            git update-index --add --cacheinfo 100644 "$BLOB" "data/$name"
          done
          git read-tree --prefix=data/chunks/ HEAD:public/items/data/chunks
          git read-tree --prefix=data/research-chunks/ HEAD:public/items/data/research-chunks
          git read-tree --prefix=data/resource-chunks/items/ HEAD:public/items/data/resource-chunks/items
          TREE=$(git write-tree)

          # Guard both the compatibility aliases and unrelated shared data.
          test "$(git rev-parse "$TREE:data/items-index.json")" = "$(git rev-parse HEAD:public/items/data/items-index.json)"
          test "$(git rev-parse "$TREE:data/research-index.json")" = "$(git rev-parse HEAD:public/items/data/research-index.json)"
          test "$(git rev-parse "$TREE:data/chunks")" = "$(git rev-parse HEAD:public/items/data/chunks)"
          test "$(git rev-parse "$TREE:data/research-chunks")" = "$(git rev-parse HEAD:public/items/data/research-chunks)"
          test "$(git rev-parse "$TREE:data/resource-chunks/items")" = "$(git rev-parse HEAD:public/items/data/resource-chunks/items)"
          test "$(git rev-parse "$TREE:data/resource-chunks/armors")" = "$(git rev-parse HEAD:public/data/resource-chunks/armors)"

          PARENT=$(git rev-parse origin/gh-pages)
          # A newer scoped deployment may have completed while this job was validating.
          LIVE_SOURCE=$(git log -1 --format=%B "$PARENT" | sed -nE "s/^(Publish public atlas from |Atlas-Soldier-Source: )([0-9a-f]{40})$/\\2/p" | head -n 1)
          if [ -n "$LIVE_SOURCE" ] && [ "$LIVE_SOURCE" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE_SOURCE"; then
            echo "A newer public release already exists: $LIVE_SOURCE; skipping stale publication."
            exit 0
          fi
          COMMIT=$(echo "Publish public atlas from $GITHUB_SHA" | git commit-tree "$TREE" -p "$PARENT")
          git push origin "$COMMIT":refs/heads/gh-pages

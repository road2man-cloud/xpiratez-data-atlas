name: XPZ3D R36HW N21 local center relief
on:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n21-center-relief.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36hw-n21-center-relief
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate N21 anatomical GLB from published N20
        run: |
          test -s experimental/xpz3d/f11/r36hw-n20-v10-nude-profile-20261129/output/R36HW_N20_V10_BODY_N19_CENTER.glb
          node experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/source/build.cjs \
            experimental/xpz3d/f11/r36hw-n20-v10-nude-profile-20261129/output/R36HW_N20_V10_BODY_N19_CENTER.glb \
            experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/output/R36HW_N21_V10_BODY_LOCAL_CENTER.glb
      - uses: actions/upload-artifact@v4
        with:
          name: r36hw-n21-local-center-glb
          path: |
            experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/output/*.glb
            experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/reports/*.json
      - name: Publish N21 GLB and audit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/output experimental/xpz3d/f11/r36hw-n21-center-surface-20261129/reports
          if ! git diff --cached --quiet; then
            git commit -m "build(xpz3d): publish R36HW N21 local center relief"
            git push origin HEAD:main
          fi

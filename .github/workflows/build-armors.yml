name: Verify canonical armor database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-armors.yml"
      - "tools/build-armor-data.mjs"
      - "tools/armor-data.mjs"
      - "tools/data-normalize.mjs"
      - "tools/check-armors.mjs"
      - "public/armors/**"
      - "public/data/armors-index.json"
      - "public/data/armor-chunks/**"
      - "public/data/armor-routes/**"
      - "public/data/armor-raw-chunks/**"
      - "public/data/resource-chunks/armors/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpiratez-armor-data-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install generator dependencies
        run: npm install

      - name: Verify canonical XPZ o1.1.1 armor database
        run: node tools/check-armors.mjs

      - name: Report canonical source fingerprint
        run: |
          node - <<'NODE'
          const x = require("./public/data/armors-index.json");
          const names = x.meta.source.rules.map(r => r.file);
          console.log("metadata sha256:", x.meta.source.metadataSha256);
          console.log("rules:", names.length, names.join(", "));
          console.log("counts:", JSON.stringify(x.counts));
          NODE

name: Publish armor database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-armors.yml"
      - "tools/build-armor-data.mjs"
      - "tools/armor-data.mjs"
      - "tools/data-normalize.mjs"
      - "tools/check-armors.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xpiratez-armor-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install generator dependencies
        run: npm install

      - name: Resolve and download official X-Piratez v.o1.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/xpz
          START_URL="https://www.moddb.com/downloads/start/311212"
          REFERER="https://www.moddb.com/mods/x-piratez/downloads/xpz-o1-19-jun-2026-reincarnated-in-another-world-but-everything-here-is-ai-slop"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36"

          curl -fL --retry 4 --connect-timeout 20 -A "$UA" -e "$REFERER" "$START_URL" -o .cache/xpz/start.html

          MIRROR_PATH="$(node -e 'const fs=require("fs"); const s=fs.readFileSync(".cache/xpz/start.html","utf8"); const m=s.match(/href="([^"]*\/downloads\/mirror\/311212\/[^"]+)"/); if(!m){console.error("Could not resolve the current ModDB mirror URL"); process.exit(2)} console.log(m[1].replaceAll("&amp;","&"));')"
          if [[ "$MIRROR_PATH" == http* ]]; then
            MIRROR_URL="$MIRROR_PATH"
          else
            MIRROR_URL="https://www.moddb.com$MIRROR_PATH"
          fi
          echo "Resolved ModDB mirror endpoint: $MIRROR_URL"

          curl -fL --retry 4 --connect-timeout 20 -A "$UA" -e "$START_URL" "$MIRROR_URL" -o .cache/xpz/Dioxine_XPiratez_o1.1.1.rar

      - name: Verify official archive
        run: echo "79c89ba604606b86614dcfeb0f376061  .cache/xpz/Dioxine_XPiratez_o1.1.1.rar" | md5sum -c -

      - name: Extract X-Piratez ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          mkdir -p .cache/unpacked
          unar -q -o .cache/unpacked .cache/xpz/Dioxine_XPiratez_o1.1.1.rar
          META=$(find .cache/unpacked -type f -path "*/user/mods/Piratez/metadata.yml" -print -quit)
          test -n "$META"
          MOD_PATH=${META%/metadata.yml}
          echo "XPIRATEZ_MOD_PATH=$MOD_PATH" >> "$GITHUB_ENV"

      - name: Generate armor database
        run: node tools/build-armor-data.mjs --source "$XPIRATEZ_MOD_PATH"

      - name: Verify armor database
        run: node tools/check-armors.mjs

      - name: Verify canonical official source
        run: |
          node -e 'const x=require("./public/data/armors-index.json"); const names=new Set(x.meta.source.rules.map(r=>r.file)); const bad=["000_Ratling_Visibility.rul","Shotguns_Rebalance.rul"].filter(x=>names.has(x)); if(bad.length) throw new Error("Local custom rules leaked into canonical armor data: "+bad.join(", "));'

      - name: Commit generated armor database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/armors-index.json public/data/armor-routes public/data/armor-chunks public/data/armor-raw-chunks public/data/resource-chunks/armors
          if git diff --cached --quiet; then
            echo "No armor data changes."
            exit 0
          fi
          git commit -m "Publish XPZ o1.1.1 armor data"
          git pull --rebase origin main
          git push origin HEAD:main

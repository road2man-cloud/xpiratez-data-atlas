name: XPZ3D R36ME physical triangle density redistribution
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36me-density-20261128/source/**'
      - '.github/workflows/xpz3d-r36me-density.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36me-density
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36mc-landmark-sculpt-20261128
            experimental/xpz3d/f11/r36me-density-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allocate body triangles more densely near source contours
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36me-density-20261128
          SCRIPT=$ROOT/source/build_r36me.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SCRIPT"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            SRC="$BASE/r36mc-landmark-sculpt-20261128/output/compact/R36MC_${V}_SCULPT_2100_COMPACT_FULL.glb"
            for STYLE in dense guarded; do
              NAME="${V}_${STYLE}"
              OUT="$ROOT/output/$NAME"
              node "$SCRIPT" "$SRC" "$OUT" "$STYLE"
              UPPER=$(echo "$STYLE" | tr '[:lower:]' '[:upper:]')
              node "$COMPACT" "$OUT/R36ME_${UPPER}_2100_FULL.glb" "$ROOT/output/compact/R36ME_${V}_${UPPER}_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['DENSE','GUARDED']){
            const name=v+'_'+s,report=JSON.parse(fs.readFileSync(path.join(root,v+'_'+s.toLowerCase(),'R36ME_'+s+'.report.json')));
            const b=fs.readFileSync(path.join(root,'compact','R36ME_'+name+'_2100_COMPACT_FULL.glb'));
            if(report.triangles!==2100||report.joints!==63||report.groupsMoved<20||report.shapeStats.folds||
              b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('Bad mesh redistribution '+name);
            console.log(name,report.groupsMoved,report.movedVertices,report.meanOldContourDistance,report.meanNewContourDistance);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36ME-physical-vertex-redistribution
          path: experimental/xpz3d/f11/r36me-density-20261128/output/
          retention-days: 90
      - name: Publish new density models without force
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36me-density-20261128/output
          for V in ART SUBTLE; do for S in dense guarded; do rm -f "$ROOT/${V}_${S}"/*.glb; done; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36ME redistributed model triangles"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

name: XPZ3D R36HW N16 re-tessellated center
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n16.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n15-center-continuity-20261129/output/R36HW_N15_CENTER_CONTINUITY.glb
            experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/
            .github/workflows/xpz3d-r36hw-n16.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual N16 connected polygon patch
        run: |
          node --check experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/source/retess_patch.cjs
          node --check experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/source/build_n16.cjs
          node experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/source/build_n16.cjs
      - name: Check GLB structure, face budget, preserved boundary
        run: |
          node - <<'NODE'
          const fs=require('fs'),d='experimental/xpz3d/f11/r36hw-n16-retess-center-20261129';
          const r=JSON.parse(fs.readFileSync(d+'/reports/R36HW_N16_RETESS_CENTER.json','utf8'));
          const b=fs.readFileSync(d+'/output/R36HW_N16_RETESS_CENTER.glb');
          if(r.trianglesBefore!==2099||r.trianglesAfter!==2099||r.pelvisTriangles!==363||r.originalCenterTriangles!==44||r.newCenterTriangles!==44||r.ringVertices!==40||!r.boundaryPreserved||r.nonmanifoldEdges!==0||r.faceFlips!==0||r.skinJoints!==63||!r.faceAndHairUnmodified||b.readUInt32LE(8)!==b.length)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.trianglesAfter,center:r.newCenterTriangles,ring:r.ringVertices,sha256:r.outputSHA256}));
          NODE
      - name: Publish new GLB and source-linked report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/output/R36HW_N16_RETESS_CENTER.glb experimental/xpz3d/f11/r36hw-n16-retess-center-20261129/reports/R36HW_N16_RETESS_CENTER.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): actual N16 joined pelvic center GLB"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

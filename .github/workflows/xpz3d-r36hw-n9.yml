name: XPZ3D R36HW N9 direct skin front geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/source/**'
      - '.github/workflows/xpz3d-r36hw-n9.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n8-soft-legfit-20261128/output/R36HW_N8_SOFT_LEGFIT.glb
            experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/
            .github/workflows/xpz3d-r36hw-n9.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remodel HW original shorts skin front using real bare-leg ring
        run: |
          node --check experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/source/build_r36hw_n9.cjs
          node experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/source/build_r36hw_n9.cjs
      - name: Check actual body model continuity
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128';
          const r=JSON.parse(fs.readFileSync(p+'/reports/R36HW_N9_DIRECT_SKIN_FRONT.json','utf8'));
          if(r.triangles!==2098||r.sourceJointCount!==63||!r.faceAndHairOriginal||r.pelvisVertexCount!==183||r.pelvisTriangleCount!==362||r.frontVerticesAdjusted<50||r.hemVerticesAdjusted<10||r.centroidVerticesRelaxed<20||r.maxMovementMeters>.055||r.minTriangleArea<1e-9)throw Error(JSON.stringify(r));
          const b=fs.readFileSync(p+'/output/R36HW_N9_DIRECT_SKIN_FRONT.glb');
          if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('Invalid GLB');
          console.log(JSON.stringify({triangles:r.triangles,front:r.frontVerticesAdjusted,hem:r.hemVerticesAdjusted,area:r.minTriangleArea,sha:r.outputSHA256}));
          NODE
      - name: Publish real N9 GLB and model change report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/output/R36HW_N9_DIRECT_SKIN_FRONT.glb experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/reports/R36HW_N9_DIRECT_SKIN_FRONT.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish N9 original HW skin-front surface reshape"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R36HW-N9-direct-skin-front
          path: |
            experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/output/R36HW_N9_DIRECT_SKIN_FRONT.glb
            experimental/xpz3d/f11/r36hw-n9-direct-skin-front-20261128/reports/R36HW_N9_DIRECT_SKIN_FRONT.json

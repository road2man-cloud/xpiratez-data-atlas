name: XPZ3D R36HW N19 lower seam reconnaissance
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/inspect_lower_seam.cjs'
      - '.github/workflows/xpz3d-r36hw-n19-scan.yml'
permissions:
  contents: write
jobs:
  seam:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/output/R36HW_N18_FRONT_SKIN_RESTORED.glb
            experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/
            .github/workflows/xpz3d-r36hw-n19-scan.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/inspect_lower_seam.cjs
          node experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/source/inspect_lower_seam.cjs experimental/xpz3d/f11/r36hw-n18-visible-resurface-20261129/output/R36HW_N18_FRONT_SKIN_RESTORED.glb experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/reports/N18_LOWER_SEAM_MAP.json
      - name: Publish actual boundary scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n19-lower-skin-bridge-20261129/reports/N18_LOWER_SEAM_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "data(f11): N18 real lower skin seam topology map"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

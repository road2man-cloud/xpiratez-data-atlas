name: XPZ3D R36HW N15 local center captures
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n15-center-render-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n15-render.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n15-center-continuity-20261129/output/R36HW_N15_CENTER_CONTINUITY.glb
            experimental/xpz3d/f11/r36hw-n15-center-render-20261129/
            .github/workflows/xpz3d-r36hw-n15-render.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render actual N15 local pelvis mesh
        run: |
          node --check experimental/xpz3d/f11/r36hw-n15-center-render-20261129/source/render_n15.cjs
          rm -rf experimental/xpz3d/f11/r36hw-n15-center-render-20261129/output
          node experimental/xpz3d/f11/r36hw-n15-center-render-20261129/source/render_n15.cjs experimental/xpz3d/f11/r36hw-n15-center-continuity-20261129/output/R36HW_N15_CENTER_CONTINUITY.glb experimental/xpz3d/f11/r36hw-n15-center-render-20261129/output
      - name: Verify six close-ups only
        run: |
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n15-center-render-20261129/output/R36HW_N15_RENDER.report.json','utf8'));
          if(r.totalTriangles!==2099||r.images.length!==6||r.images.some(im=>im.bytes<4000))throw Error(JSON.stringify({triangles:r.totalTriangles,images:r.images}));
          console.log(JSON.stringify({triangles:r.totalTriangles,views:r.images.length,sha:r.sourceSHA256}));
          NODE
      - name: Publish real model close-up renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n15-center-render-20261129/output
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): N15 center-only actual GLB close-ups"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

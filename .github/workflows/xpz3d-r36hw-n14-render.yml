name: XPZ3D R36HW N14 local center captures
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n14-center-render-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n14-render.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128/source/glb_io.cjs
            experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/output/R36HW_N14_THREE_POLE_CENTER.glb
            experimental/xpz3d/f11/r36hw-n14-center-render-20261129/
            .github/workflows/xpz3d-r36hw-n14-render.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render actual N14 local pelvis mesh
        run: |
          node --check experimental/xpz3d/f11/r36hw-n14-center-render-20261129/source/render_n14.cjs
          rm -rf experimental/xpz3d/f11/r36hw-n14-center-render-20261129/output
          node experimental/xpz3d/f11/r36hw-n14-center-render-20261129/source/render_n14.cjs experimental/xpz3d/f11/r36hw-n14-three-pole-center-20261129/output/R36HW_N14_THREE_POLE_CENTER.glb experimental/xpz3d/f11/r36hw-n14-center-render-20261129/output
      - name: Validate six actual close-ups
        run: |
          node - <<'NODE'
          const fs=require('fs'),f='experimental/xpz3d/f11/r36hw-n14-center-render-20261129/output/R36HW_N14_RENDER.report.json',r=JSON.parse(fs.readFileSync(f,'utf8'));
          if(r.totalTriangles!==2099||r.images.length!==6||r.images.some(i=>i.bytes<4000))throw Error(JSON.stringify({triangles:r.totalTriangles,images:r.images}));
          console.log(JSON.stringify({triangles:r.totalTriangles,images:r.images.length,sha:r.sourceSHA256}));
          NODE
      - name: Publish local views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n14-center-render-20261129/output
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): capture actual N14 sewn-center GLB geometry"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

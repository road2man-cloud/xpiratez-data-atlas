name: XPZ3D R36HW N13 local topology
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/source/**'
      - '.github/workflows/xpz3d-r36hw-n13.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experimental/xpz3d/f11/r36hw-n12-center-only-20261129/output/R36HW_N12_CENTER_ATTACHED.glb
            experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/
            .github/workflows/xpz3d-r36hw-n13.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/source/build_n13.cjs
          node experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/source/build_n13.cjs
      - name: Validate N13 result
        run: |
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/reports/R36HW_N13_CENTER_TOPOLOGY.json','utf8'));
          const b=fs.readFileSync('experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/output/R36HW_N13_CENTER_TOPOLOGY.glb');
          if(r.triangles!==2095||r.skinJoints!==63||!r.sourceFaceAndHairUnchanged||r.newRegionSkinnyCount>r.originalRegionSkinnyCount||b.readUInt32LE(8)!==b.length)throw Error(JSON.stringify(r));
          console.log(JSON.stringify({triangles:r.triangles,flips:r.edgeFlips,skinnyBefore:r.originalRegionSkinnyCount,skinnyAfter:r.newRegionSkinnyCount}));
          NODE
      - name: Publish actual new N13 GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/output/R36HW_N13_CENTER_TOPOLOGY.glb experimental/xpz3d/f11/r36hw-n13-center-topology-20261129/reports/R36HW_N13_CENTER_TOPOLOGY.json
          if ! git diff --cached --quiet; then
            git commit -m "build(f11): publish N13 original-center reoriented topology"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi

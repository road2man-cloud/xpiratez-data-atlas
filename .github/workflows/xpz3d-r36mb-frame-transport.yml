name: XPZ3D R36MB reproject image details into sculpted TBN frames
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36mb-frame-transport-20261128/source/**'
      - '.github/workflows/xpz3d-r36mb-frame-transport.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36mb-frame-transport
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36lt-texture-projection-20261128
            experimental/xpz3d/f11/r36lx-polygon-texture-20261128
            experimental/xpz3d/f11/r36ma-seam-rebake-20261128
            experimental/xpz3d/f11/r36mb-frame-transport-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce normal-frame aligned image texture and skinned GLB variants
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36mb-frame-transport-20261128
          SCRIPT=$ROOT/source/build_r36mb.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SCRIPT"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            SRC="$BASE/r36lx-polygon-texture-20261128/output/compact/R36LX_${V}_POLYGON_DETAIL_2100_COMPACT_FULL.glb"
            for S in FLOW GUARDED; do
              NAME="${V}_${S}"
              TGT="$BASE/r36ma-seam-rebake-20261128/output/compact/R36MA_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              node --max-old-space-size=6144 "$SCRIPT" "$SRC" "$TGT" "$OUT" .72
              node --max-old-space-size=6144 "$COMPACT" "$OUT/R36MB_FRAME_ALIGNED_2100_FULL.glb" "$ROOT/output/compact/R36MB_${NAME}_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['FLOW','GUARDED']){
            const name=v+'_'+s,r=JSON.parse(fs.readFileSync(path.join(dir,name,'R36MB_FRAME_ALIGNED.report.json')));
            const b=fs.readFileSync(path.join(dir,'compact','R36MB_'+name+'_2100_COMPACT_FULL.glb'));
            if(r.triangles!==2100||r.joints!==63||r.transport.changedPixels<1000||
              r.seams.edgesRebaked<4||b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)
              throw Error('R36MB model contract failed '+name);
            console.log(name,'imageNormalPixels',r.transport.changedPixels,'seamEdges',r.seams.edgesRebaked,'bytes',b.length);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MB-original-image-normal-transport-all-variants
          path: experimental/xpz3d/f11/r36mb-frame-transport-20261128/output/
          retention-days: 90
      - name: Publish 4 compact GLBs and image textures without force push
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36mb-frame-transport-20261128/output
          for V in ART SUBTLE; do
            for S in FLOW GUARDED; do rm -f "$ROOT/${V}_${S}/R36MB_FRAME_ALIGNED_2100_FULL.glb"; done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36MB source image normal transport models"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

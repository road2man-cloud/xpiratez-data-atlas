name: XPZ3D R36MI fitted newly budgeted contour controls
on:
  push:
    branches: [main]
    paths:
      - 'experimental/xpz3d/f11/r36mi-contour-control-20261128/source/**'
      - '.github/workflows/xpz3d-r36mi-contour-control.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpz3d-r36mi-contour-control
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            experimental/xpz3d/f11/r36kz-chest-center-shape-20261128
            experimental/xpz3d/f11/r36lp-skin-rebake-20261128
            experimental/xpz3d/f11/r36ls-illustrated-skin-20261128
            experimental/xpz3d/f11/r36mc-landmark-sculpt-20261128
            experimental/xpz3d/f11/r36mf-integrated-20261128
            experimental/xpz3d/f11/r36mg-edge-remesh-20261128
            experimental/xpz3d/f11/r36mh-budget-transfer-20261128
            experimental/xpz3d/f11/r36mi-contour-control-20261128
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move only newly split physical controls and reorient atlas normals
        shell: bash
        run: |
          set -euo pipefail
          BASE=experimental/xpz3d/f11
          ROOT=$BASE/r36mi-contour-control-20261128
          SRC=$ROOT/source/build_r36mi.cjs
          CLAY=$BASE/r36mf-integrated-20261128/source/create_clay.cjs
          COMPACT=$BASE/r36ls-illustrated-skin-20261128/source/compact_glb.cjs
          node --check "$SRC"
          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output/compact"
          for V in ART SUBTLE; do
            for STYLE in DENSE GUARDED; do
              NAME="${V}_${STYLE}"
              OLD="$BASE/r36mg-edge-remesh-20261128/output/compact/R36MG_${NAME}_2100_COMPACT_FULL.glb"
              SOURCE="$BASE/r36mh-budget-transfer-20261128/output/compact/R36MH_${NAME}_2100_COMPACT_FULL.glb"
              OUT="$ROOT/output/$NAME"
              SCALE=1.0
              [ "$STYLE" = GUARDED ] && SCALE=0.62 || true
              node --max-old-space-size=4096 "$SRC" "$OLD" "$SOURCE" "$OUT" "$SCALE"
              node "$CLAY" "$OUT/R36MI_CONTOUR_2100_FULL.glb" "$OUT/R36MI_CLAY_2100_FULL.glb"
              node "$COMPACT" "$OUT/R36MI_CONTOUR_2100_FULL.glb" "$ROOT/output/compact/R36MI_${NAME}_2100_COMPACT_FULL.glb"
              node "$COMPACT" "$OUT/R36MI_CLAY_2100_FULL.glb" "$ROOT/output/compact/R36MI_${NAME}_CLAY_2100_COMPACT_FULL.glb"
            done
          done
          node - "$ROOT/output" <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.argv[2];
          for(const v of ['ART','SUBTLE'])for(const s of ['DENSE','GUARDED']){
            const k=v+'_'+s,r=JSON.parse(fs.readFileSync(path.join(root,k,'R36MI_CONTOUR.report.json')));
            if(r.totalTriangles!==2100||r.bones!==63||r.geometry.acceptedControlVertices<4||
              r.geometry.meanAfterContourDistance>=r.geometry.meanBeforeContourDistance||
              r.normalTexture.changedNormalPixels<100)throw Error('invalid fitted controls '+k);
            for(const suf of ['','_CLAY']){
              const file=path.join(root,'compact','R36MI_'+k+suf+'_2100_COMPACT_FULL.glb');
              const b=fs.readFileSync(file);
              if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('bad glb '+file);
            }
            console.log(k,r.geometry.acceptedControlVertices,r.normalTexture.changedNormalPixels);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: R36MI-actual-contour-aligned-centroid-vertices
          path: experimental/xpz3d/f11/r36mi-contour-control-20261128/output/
          retention-days: 90
      - name: Publish R36MI compact GLBs, texture and reports
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experimental/xpz3d/f11/r36mi-contour-control-20261128/output
          for V in ART SUBTLE; do for S in DENSE GUARDED; do rm -f "$ROOT/${V}_${S}"/*.glb; done; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xpz3d: publish R36MI contour-guided control vertices and corrected normals"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

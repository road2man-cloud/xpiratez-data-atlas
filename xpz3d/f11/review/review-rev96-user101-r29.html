<!doctype html><html lang="ko"><meta charset="utf-8"><title>rev96 r29 / r28b 3D comparison</title><style>body{margin:0;background:#111820;color:#eee;font:14px system-ui}header{padding:18px}main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.scene{height:75vh;min-height:420px;border:1px solid #445;position:relative}.scene label{position:absolute;top:12px;left:14px;z-index:1;background:#0009;padding:5px}canvas{display:block}a{color:#8de2ff}</style><header><h2>F11 rev96 — r28b / r29 볼륨 비교</h2><p>두 화면을 각각 드래그하여 회전하고 휠로 확대하십시오. r29는 1차 후보이며 외형 승인 전입니다. <a href="REV96_USER101_R29_ACCEPTANCE.json">판정 JSON</a></p></header><main><div class="scene" id="a"><label>r28b 기준</label></div><div class="scene" id="b"><label>r29 신규 GLB</label></div></main><script type="module">import * as T from 'https://esm.sh/three@0.162.0';import{GLTFLoader}from'https://esm.sh/three@0.162.0/examples/jsm/loaders/GLTFLoader.js';import{OrbitControls}from'https://esm.sh/three@0.162.0/examples/jsm/controls/OrbitControls.js';for(const [id,file]of[['a','r21AO-F11-user101-integrated-oval-r28b-lowstrain-skin-retopo.glb'],['b','r21AO-F11-user101-integrated-oval-r29-posterior-oval-volume.glb']]){const el=document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#24303a');const camera=new T.PerspectiveCamera(42,el.clientWidth/el.clientHeight,.01,100);camera.position.set(.28,-.48,.49);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(el.clientWidth,el.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x445466,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(1,1,3);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,-.015,.89);controls.update();new GLTFLoader().load(file,g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.frustumCulled=false;}});},undefined,e=>{el.querySelector('label').textContent+=' | LOAD ERROR: '+e.message});const loop=()=>{requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)};loop();window.addEventListener('resize',()=>{camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)})}</script></html>

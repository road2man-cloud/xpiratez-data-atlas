<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R36LN | 실제 GLB 피부 명암 원인 분리</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif}*{box-sizing:border-box}
body{margin:0;background:#091722;color:#e8f0f5}header{padding:15px 18px;background:#142c3d;border-bottom:1px solid #355163}
h1{font-size:18px;margin:0 0 5px}small{color:#9fb9c8}main{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 76px)}

#log{font:11px/1.6 monospace;white-space:pre-wrap;word-break:break-word;color:#b2d4cf}
p{font-size:12px;line-height:1.6;color:#bfd1dd}@media(max-width:750px){main{display:block;height:auto}#viewport{height:65vh}}
</style>
<script type="importmap">{"imports":{"three":"../../r36kp/preview/vendor/three.module.js","three/addons/":"../../r36kp/preview/vendor/"}}</script>
</head><body><header><h1>R36LN · 피부 명암 원인 분리 실험실</h1><small>R36LE 게시 GLB 직접 조립 · 원본 메시 무변경 · S2 엔진 재현 아님</small></header>
<main><aside>
<label>보존된 실제 모델</label><select id="variant"><option value="0">R36LE SKIN</option><option value="1">R36LE FLOW</option></select>
<label>재질 분리 모드</label><select id="mode">
<option value="pbr">원본 PBR (기준)</option><option value="flat">무조명 Albedo (색상맵 검사)</option>
<option value="smooth">확산광 / 노멀맵 제외</option><option value="normal">확산광 / 노멀맵 적용</option>
<option value="classic">클래식 Phong / 약한 노멀</option><option value="wire">메시 와이어프레임 (형상 검사)</option>
</select>
<label>노멀 강도 <span id="normalValue">0.22</span></label><input id="normalStrength" type="range" min="0" max="100" value="22">
<label>회전각 <span id="yawValue">0°</span></label><input id="yaw" type="range" min="-180" max="180" value="0">
<label>카메라</label><select id="camera"><option value="whole">전신</option><option value="chest">흉부</option><option value="pelvis">골반</option><option value="face">얼굴</option></select>
<button id="snapshot">현재 실제 WebGL 화면 PNG 저장</button><p>각 모드는 동일한 GLB, 카메라, 조명 하에서 비교합니다. 무조명에서도 삼각형 무늬가 나타나면 컬러맵 또는 메시에 베이크된 표현이 의심됩니다. 확산광에서만 나타나면 실제 표면·노멀·조명 효과를 분리해 분석합니다.</p>
<div id="log">GLB 로드 시작 전</div>
</aside><div id="viewport"><canvas id="canvas"></canvas><div id="hud">로딩 중</div></div></main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id), log=m=>{$('log').textContent=m+'\n'+$('log').textContent.slice(0,1600)};
const repoBase='../'; // viewer lives in preview/, archive resides one directory up
let manifest,root,materials=[],sphere,activeURL=null;
const renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0x1b2b35);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x5b6679,2.0));
const key=new THREE.DirectionalLight(0xffffff,1.9);key.position.set(2,5,6);scene.add(key);
const camera=new THREE.PerspectiveCamera(35,1,.01,1000);camera.position.set(0,1.5,5);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);
function fit(){
 if(!root)return;
 const box=new THREE.Box3().setFromObject(root),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
 const region=$('camera').value,scale=region==='whole'?1:region==='chest'?.38:region==='face'?.24:.32;
 const y=region==='face'?box.max.y-s.y*.12:region==='chest'?box.min.y+s.y*.72:region==='pelvis'?box.min.y+s.y*.49:c.y;
 const dist=Math.max(s.y*scale/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))),.5);
 controls.target.set(c.x,y,c.z);camera.position.set(c.x,y, c.z+dist*1.35);controls.update();
}
function originalMaterial(m){return m.userData?.originalMaterial||m}
function applyMode(){
 if(!root)return;
 const mode=$('mode').value,str=Number($('normalStrength').value)/100;
 $('normalValue').textContent=str.toFixed(2);
 root.traverse(o=>{
  if(!o.isMesh)return;
  const original=o.userData.originalMaterials || (o.userData.originalMaterials=Array.isArray(o.material)?o.material.slice():[o.material]);
  const create=(src)=>{
   if(mode==='pbr')return src;
   if(mode==='wire')return new THREE.MeshBasicMaterial({color:0x57e0cb,wireframe:true,side:THREE.DoubleSide,skinning:!!o.isSkinnedMesh});
   const shared={map:src.map||null,color:src.color?.clone()||new THREE.Color(0xffffff),
    transparent:src.transparent,opacity:src.opacity,alphaTest:src.alphaTest,side:src.side,
    skinning:!!o.isSkinnedMesh,vertexColors:!!src.vertexColors};
   if(mode==='flat')return new THREE.MeshBasicMaterial(shared);
   const normal=mode==='normal'||mode==='classic'?src.normalMap||null:null;
   const normalScale=new THREE.Vector2(mode==='classic'?str:str,mode==='classic'?str:str);
   if(mode==='classic')return new THREE.MeshPhongMaterial({...shared,normalMap:normal,normalScale,shininess:8,specular:new THREE.Color(0x242424)});
   return new THREE.MeshLambertMaterial({...shared,normalMap:normal,normalScale});
  };
  const fresh=original.map(create);
  if(o.material!==original && o.material!==original[0]){
   const prior=Array.isArray(o.material)?o.material:[o.material];
   prior.forEach(m=>{if(!original.includes(m))m.dispose()});
  }
  o.material=Array.isArray(o.userData.originalMaterials)&&o.userData.originalMaterials.length>1?fresh:fresh[0];
 });
 $('hud').textContent='GLB 실물 · '+mode.toUpperCase()+' · 원본 지오메트리 보존';
}
async function load(){
 const idx=Number($('variant').value);$('hud').textContent='GLB 조립 및 검증 중';
 if(!manifest){const r=await fetch(repoBase+'ARTIFACTS.json');if(!r.ok)throw Error('manifest HTTP '+r.status);manifest=await r.json()}
 const entry=manifest.files[idx];if(!entry)throw Error('variant 없음');
 const parts=[];let bytes=0;
 for(const part of entry.parts){
  const r=await fetch(repoBase+part.path);if(!r.ok)throw Error(part.path+' HTTP '+r.status);
  const a=new Uint8Array(await r.arrayBuffer());if(a.length!==part.bytes)throw Error('part 크기 불일치 '+part.path);
  parts.push(a);bytes+=a.length;
 }
 if(bytes!==entry.bytes)throw Error('GLB 총 길이 불일치');
 const combined=new Uint8Array(bytes);let off=0;
 for(const a of parts){combined.set(a,off);off+=a.length}
 const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',combined))).map(n=>n.toString(16).padStart(2,'0')).join('');
 if(digest!==entry.sha256)throw Error('GLB SHA-256 불일치 '+digest);
 const url=URL.createObjectURL(new Blob([combined],{type:'model/gltf-binary'}));
 const gltf=await new GLTFLoader().loadAsync(url);URL.revokeObjectURL(url);
 if(root)scene.remove(root);root=gltf.scene;scene.add(root);
 // Only original model materials are stored; mode switches never alter geometry or skeleton.
 root.traverse(o=>{if(o.isMesh)o.userData.originalMaterials=Array.isArray(o.material)?o.material.slice():[o.material]});
 root.rotation.y=THREE.MathUtils.degToRad(Number($('yaw').value));
 fit();applyMode();log('성공: '+entry.output+'\nSHA-256: '+digest+'\n바이트: '+bytes);
}
$('variant').onchange=()=>load().catch(e=>{log('오류: '+e.message);$('hud').textContent='로드 실패'});
$('mode').onchange=applyMode;$('normalStrength').oninput=applyMode;
$('camera').onchange=fit;
$('yaw').oninput=()=>{if(root)root.rotation.y=THREE.MathUtils.degToRad(Number($('yaw').value));$('yawValue').textContent=$('yaw').value+'°'};
$('snapshot').onclick=()=>{const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='R36LN_'+$('variant').value+'_'+$('mode').value+'.png';a.click()};
function frame(){requestAnimationFrame(frame);const v=$('viewport'),w=v.clientWidth,h=v.clientHeight;if(w>0&&h>0){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera)}}frame();
load().catch(e=>{log('오류: '+e.message);$('hud').textContent='로드 실패'});
</script></body></html>

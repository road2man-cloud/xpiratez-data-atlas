<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R36HW V26 / V27 GLB comparison</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#15191e;color:#e5e9ef;font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:22px}p{color:#b6c0cc;line-height:1.5}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}button,label.file{border:1px solid #566575;background:#25313d;color:inherit;padding:9px 13px;border-radius:7px;cursor:pointer}button:focus-visible{outline:2px solid #9bc5ff}label.file input{display:none}.models{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#20262f;border:1px solid #394452;border-radius:12px;overflow:hidden}.heading{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:6px}model-viewer{display:block;width:100%;height:clamp(300px,65vh,780px);background:#303740}.status{font-size:12px;color:#bac6d2}.note{font-size:13px}@media(max-width:620px){main{padding:10px}.models{gap:6px}.heading{display:block;padding:8px}model-viewer{height:52vh}.controls{gap:5px}button,label.file{padding:7px 8px;font-size:12px}}</style></head>
<body><main><h1>V26 / V27 실제 GLB 비교</h1><p>동일한 카메라와 조명으로 얼굴 법선 및 재질 변경을 비교합니다. 브라우저 glTF 뷰어이며 S2 네이티브 렌더러가 아닙니다.</p>
<div class="controls"><button data-view="front">정면</button><button data-view="side">측면</button><button data-view="back">후면</button><button data-view="head">얼굴 확대</button><label><input id="sync" type="checkbox" checked> 카메라 연동</label><label>노출 <input id="exposure" type="range" min=".6" max="1.6" step=".05" value="1"></label></div>
<div class="models"><section class="panel"><div class="heading"><strong>V26 기준</strong><label class="file">GLB 선택<input type="file" accept=".glb" data-for="a"></label><span class="status" id="sa">로딩 대기</span></div><model-viewer id="a" src="https://raw.githubusercontent.com/road2man-cloud/xpiratez-data-atlas/d360e229c75d9a1cca4de6f8ef3ae0f641ea87af/experimental/xpz3d/f11/r36hw-athletic-v26-sleeve-skinning-20261129/output/R36HW_F11_ATHLETIC_SUIT_V26_SLEEVE_SKIN.glb" camera-controls interaction-prompt="none" camera-target="0m 1.0m 0m" camera-orbit="0deg 90deg 3.3m" field-of-view="35deg" exposure="1" shadow-intensity=".65" shadow-softness=".8" environment-image="neutral" disable-tap></model-viewer></section>
<section class="panel"><div class="heading"><strong>V27 개선</strong><label class="file">GLB 선택<input type="file" accept=".glb" data-for="b"></label><span class="status" id="sb">로딩 대기</span></div><model-viewer id="b" src="../output/R36HW_F11_ATHLETIC_SUIT_V27_FACE.glb" camera-controls interaction-prompt="none" camera-target="0m 1.0m 0m" camera-orbit="0deg 90deg 3.3m" field-of-view="35deg" exposure="1" shadow-intensity=".65" shadow-softness=".8" environment-image="neutral" disable-tap></model-viewer></section></div>
<p class="note">GitHub 코드 페이지에서는 HTML이 실행되지 않습니다. 파일을 내려받아 브라우저에서 열고 각 GLB를 선택하거나 정적 서버에 전체 패키지를 배치하십시오. CDN 또는 모델 네트워크 연결이 차단되면 로딩이 실패할 수 있습니다.</p>
<script>
const a=document.querySelector('#a'),b=document.querySelector('#b'),models=[a,b],status=m=>document.querySelector('#s'+m.id),objects=new Map();
const presets={front:['0deg 90deg 3.3m','0m 1m 0m'],side:['90deg 90deg 3.3m','0m 1m 0m'],back:['180deg 90deg 3.3m','0m 1m 0m'],head:['0deg 90deg 0.90m','0m 1.74m 0m']};
for(const m of models){m.addEventListener('load',()=>{status(m).textContent='로드 완료';m.jumpCameraToGoal()});m.addEventListener('error',()=>status(m).textContent='로드 실패 — GLB 선택');m.addEventListener('camera-change',e=>{if(!document.querySelector('#sync').checked||e.detail.source!=='user-interaction')return;const other=m===a?b:a,o=m.getCameraOrbit(),t=m.getCameraTarget();other.cameraOrbit=o.theta+'rad '+o.phi+'rad '+o.radius+'m';other.cameraTarget=t.x+'m '+t.y+'m '+t.z+'m';other.fieldOfView=m.getFieldOfView()+'deg';other.jumpCameraToGoal()})}
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{const [orbit,target]=presets[el.dataset.view];for(const m of models){m.cameraOrbit=orbit;m.cameraTarget=target;m.fieldOfView='35deg';if(m.jumpCameraToGoal)m.jumpCameraToGoal()}}));
document.querySelector('#exposure').addEventListener('input',e=>models.forEach(m=>m.exposure=Number(e.target.value)));
document.querySelectorAll('input[type=file]').forEach(el=>el.addEventListener('change',()=>{if(!el.files[0])return;const m=document.getElementById(el.dataset.for),old=objects.get(m);if(old)URL.revokeObjectURL(old);const url=URL.createObjectURL(el.files[0]);objects.set(m,url);status(m).textContent='로딩 중';m.src=url}));
setTimeout(()=>{if(!customElements.get('model-viewer'))models.forEach(m=>status(m).textContent='뷰어 모듈 로딩 실패 — CDN 확인')},12000);
</script></main></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R36HW N3 · 원본 기반 메시 비교</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#141a23;color:#f0f4f7;font:14px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{padding:16px 20px;border-bottom:1px solid #384655;background:#202b39}
h1{font-size:20px;margin:0 0 5px}header p{margin:0;color:#b8c7d2}
main{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 92px);min-height:620px}
aside{padding:20px;background:#1a2430;overflow:auto;border-right:1px solid #364656}
label{display:block;color:#c1d0df;margin:13px 0 5px}select,button{font:inherit;color:#fff;border:1px solid #526578;border-radius:6px;background:#263849;padding:8px}
select{width:100%}button{cursor:pointer}button:hover{background:#3b5167}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}a{color:#94d5ee}
small,.hint{color:#aebdc9;font-size:12px}#status{white-space:pre-wrap;margin-top:16px;color:#8fd1b6;word-break:break-word}
#viewer{position:relative;min-height:500px;overflow:hidden}
#canvas{display:block;width:100%;height:100%;touch-action:none}
#panels{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;display:flex;gap:8px}
#panels span{flex:1;text-align:center;background:#122130dc;padding:6px 12px;border:1px solid #435a72;border-radius:6px}
.note{margin-top:17px;border-left:3px solid #668aa0;padding-left:10px}
@media(max-width:800px){main{display:block;height:auto}aside{border-right:none}#viewer{height:68vh}}
</style>
<script type="importmap">{"imports":{"three":"../../r36kp/preview/vendor/three.module.js","three/addons/":"../../r36kp/preview/vendor/"}}</script>
</head><body>
<header><h1>R36HW-N3 · 기하 구조 개선 비교</h1><p>원본 메시를 로딩한 Three.js 진단 뷰어입니다. 네이티브 S2 화면이 아닙니다. 사진은 텍스처로 투영하지 않았습니다.</p></header>
<main><aside>
<label for="left">왼쪽 모델</label><select id="left"><option value="hw">R36HW 원본(의복)</option><option value="n2">R36HW N2</option><option value="n3">R36HW N3</option><option value="n4">R36HW N4 · 재질 개선</option><option value="n5">R36HW N5 · 이음매 연결</option></select>
<label for="right">오른쪽 모델</label><select id="right"><option value="n5">R36HW N5 · 이음매 연결</option><option value="n3">R36HW N3</option><option value="n2">R36HW N2</option><option value="n4">R36HW N4 · 재질 개선</option><option value="hw">R36HW 원본(의복)</option></select>
<label for="surface">표면</label><select id="surface"><option value="clay">CLAY · 텍스처 없는 메시 비교</option><option value="textured">PBR · 원본 피부·색상</option><option value="wire">WIRE · 삼각형 경계</option></select>
<label>카메라 방향</label><div class="grid"><button type="button" data-camera="front">정면</button><button type="button" data-camera="oblique">사선 35°</button><button type="button" data-camera="side">측면</button><button type="button" data-camera="full">전신</button></div>
<label><input type="checkbox" id="rotation"> 자동 회전</label>
<p class="note hint">왼쪽과 오른쪽 모두 실제 GLB를 불러오며 동일 카메라·조명을 사용합니다. 중심부의 함몰·곡률·인접면 연결을 먼저 CLAY에서 평가하세요. 피부가 가려진 곳의 재구성, 최종 의복 제거, 네이티브 S2 스키닝은 아직 미완료입니다.</p>
<p id="status">GLB 로딩 중</p>
<p><a href="../output/R36HW_N3_CURVATURE.glb">N3 GLB 원본 파일 열기</a></p>
<p><a href="../reports/R36HW_N3_CURVATURE.json">정점 변형량 및 폴리곤 보고서</a></p>
</aside>
<div id="viewer"><canvas id="canvas"></canvas><div id="panels"><span id="labelLeft">R36HW 원본</span><span id="labelRight">R36HW N3</span></div></div>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),canvas=$('canvas'),paths={
 hw:'../../r36kp/reference/R36HW_F11_CLOTHED.glb',
 n2:'../../r36hw-n2-local-sculpt-20261128/output/R36HW_N2_REGION_SCULPT.glb',
 n3:'../output/R36HW_N3_CURVATURE.glb',
 n4:'../../r36hw-n4-skin-material-20261128/output/R36HW_N4_SKIN_DETAIL.glb',
 n5:'../../r36hw-n5-skin-seams-20261128/output/R36HW_N5_SEAM_LINK.glb'
};
const names={hw:'R36HW 원본',n2:'R36HW N2',n3:'R36HW N3',n4:'R36HW N4',n5:'R36HW N5'};
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17202b);
scene.add(new THREE.HemisphereLight(0xffffff,0x63778b,2.1));
const light=new THREE.DirectionalLight(0xfff2e6,2.4);light.position.set(-.6,-1.3,1.7);scene.add(light);
const rim=new THREE.DirectionalLight(0x9bbfe3,.65);rim.position.set(.5,1.3,1.7);scene.add(rim);
const cam=new THREE.PerspectiveCamera(30,1,.003,40);cam.up.set(0,0,1);
const controls=new OrbitControls(cam,canvas);controls.enableDamping=true;controls.minDistance=.10;controls.maxDistance=8;
let mode='front',roots={},pending=new Set(),lastCam='';const loader=new GLTFLoader();
function load(k){
 if(roots[k]||pending.has(k))return;
 pending.add(k);$('status').textContent='로딩 중: '+names[k];
 loader.load(paths[k],data=>{
  const root=data.scene;root.visible=false;
  root.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=false;
   o.userData.originalMaterials=Array.isArray(o.material)?o.material.map(m=>m.clone()):[o.material.clone()];
  });
  scene.add(root);roots[k]=root;pending.delete(k);applyMaterial();update();
 },undefined,err=>{$('status').textContent='로딩 실패: '+names[k]+' — '+err.message;pending.delete(k)});
}
function applyMaterial(){
 const choice=$('surface').value;
 for(const r of Object.values(roots))r.traverse(o=>{
  if(!o.isMesh)return;
  const original=o.userData.originalMaterials||[];
  const materials=original.map(m=>{
   if(choice==='clay')return new THREE.MeshStandardMaterial({color:0xb4bcc1,metalness:0,roughness:.88,side:THREE.DoubleSide});
   if(choice==='wire')return new THREE.MeshBasicMaterial({color:0x8fd9f0,side:THREE.DoubleSide,wireframe:true});
   return m.clone();
  });
  o.material=materials.length===1?materials[0]:materials;
 });
}
function frameCam(){
 const target=mode==='full'?new THREE.Vector3(0,0,1.02):new THREE.Vector3(0,-.063,.916);
 const dist=mode==='full'?3.55:mode==='side'?.49:.44;
 const dir=mode==='front'?new THREE.Vector3(0,-1,.09):
 mode==='oblique'?new THREE.Vector3(.574,-.819,.12):
 mode==='side'?new THREE.Vector3(1,0,.10):new THREE.Vector3(.3,-.95,.17);
 cam.position.copy(target).add(dir.normalize().multiplyScalar(dist));cam.lookAt(target);controls.target.copy(target);controls.update();
}
function update(){
 const l=$('left').value,r=$('right').value;load(l);load(r);
 $('labelLeft').textContent=names[l];$('labelRight').textContent=names[r];
 if(roots[l]&&roots[r])$('status').textContent='두 GLB 로딩 완료 · 왼쪽 '+names[l]+' / 오른쪽 '+names[r];
}
$('left').addEventListener('change',update);$('right').addEventListener('change',update);
$('surface').addEventListener('change',applyMaterial);
document.querySelectorAll('[data-camera]').forEach(el=>el.addEventListener('click',()=>{mode=el.dataset.camera;frameCam()}));
frameCam();update();
function tick(){
 requestAnimationFrame(tick);
 const w=Math.round(canvas.clientWidth),h=Math.round(canvas.clientHeight);if(w<=0||h<=0)return;
 renderer.setSize(w,h,false);
 const l=roots[$('left').value],r=roots[$('right').value];
 for(const obj of Object.values(roots))obj.visible=false;
 if($('rotation').checked){const a=Date.now()/5000;cam.position.x=controls.target.x+Math.sin(a)*.42;cam.position.y=controls.target.y-Math.cos(a)*.42;cam.lookAt(controls.target)}else controls.update();
 renderer.setScissorTest(true);
 const mid=Math.floor(w/2);
 for(let i=0;i<2;i++){
  const obj=i===0?l:r;
  const vx=i===0?0:mid, vw=i===0?mid:w-mid;
  if(!vw)continue;
  renderer.setViewport(vx,0,vw,h);renderer.setScissor(vx,0,vw,h);
  cam.aspect=vw/h;cam.updateProjectionMatrix();
  if(obj)obj.visible=true;renderer.render(scene,cam);if(obj)obj.visible=false;
 }
 renderer.setScissorTest(false);
}
tick();
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Piratez 2.1 병종 DB</title>
<meta name="robots" content="noindex,follow">
<noscript><meta http-equiv="refresh" content="0;url=./modern/"></noscript>
<script>
(() => {
  // All Soldier DB entries now resolve to one current v.o2 ruleset.
  const target = new URL("./modern/", location.href);
  const from = new URLSearchParams(location.search);
  for (const key of ["family","q","profile","training","excludeTraining","excludeTrait","trainingSequence","researchSequence","research","branch","body","mode","route","minDepth","minTraits","researchAction","recruitResearch","recruitItem","view","group","origin","captain","trait","difficulty","metric","certified","fixedOptimumOnly","transitionBreakthroughOnly","missingOnly","selectedOnly","a","b","sameChoices","sort","dir","stat","populationRoute","candidate"]) {
    if (from.has(key)) target.searchParams.set(key,["training","trait","excludeTraining","excludeTrait","trainingSequence","researchSequence","researchAction","recruitResearch","recruitItem"].includes(key)?from.getAll(key).join(","):from.get(key));
  }
  for (const stat of ["tu","stamina","health","bravery","reactions","firing","throwing","strength","psiStrength","psiSkill","melee","mana","total"]) {
    const key="min_"+stat;if(from.has(key))target.searchParams.set(key,from.get(key));
  }
  if (["profiles","soldiers","transformations"].includes(from.get("dataset")))
    target.searchParams.set("dataset",from.get("dataset"));
  target.hash = ["#researchMaxima","#legacyMaximaArchive"].includes(location.hash)
    ? "#originMaxima" : location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<main>
  <p>X-Piratez 2.1 병종 DB로 이동합니다.</p>
  <p><a href="./modern/">병종 DB 열기</a></p>
</main>
</body>
</html>
